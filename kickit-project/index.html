<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOR THE FAIREST GODDESS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#030003;min-height:100vh;display:flex;align-items:center;justify-content:center;}
#cursor{position:fixed;width:48px;height:48px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
/* ── TRANSFORMATION SCREEN ── */
#transform-screen{width:100%;max-width:700px;min-height:740px;background:#060006;position:relative;overflow:hidden;border-radius:14px;cursor:none;}
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
#pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.header{position:relative;z-index:2;text-align:center;padding:24px 20px 4px;}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:0.5em;color:rgba(212,175,55,0.45);margin-bottom:4px;text-transform:uppercase;}
.header h1{font-family:'Cinzel',serif;font-size:20px;font-weight:600;letter-spacing:0.13em;color:#d4af37;line-height:1.35;}
.hdiv{display:flex;align-items:center;justify-content:center;gap:10px;margin:7px auto 0;width:240px;}
.hline{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.45),transparent);}
.hgem{width:5px;height:5px;background:#d4af37;transform:rotate(45deg);}
.stage{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:10px 4px 0;min-height:400px;}
.char-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.char-label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.22em;color:rgba(212,175,55,0.7);margin-top:3px;}
.char-frame{width:190px;height:380px;position:relative;}
.char-frame svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity 0.9s ease,filter 1.1s ease;}
.char-frame img.char-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity 0.9s ease,filter 1.1s ease;}
.idol-svg{opacity:0;}
.idol-svg.visible{opacity:1;}
.char-svg.hidden{opacity:0;}
.char-img.idol-img{opacity:0;}
.char-img.idol-img.visible{opacity:1;}
.char-img.char-img-before.hidden{opacity:0;}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-bottom:26px;}
.tbtn{width:60px;height:60px;border-radius:50%;background:rgba(212,175,55,0.07);border:1px solid rgba(212,175,55,0.5);cursor:none;display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative;flex-shrink:0;}
.tbtn:hover{background:rgba(212,175,55,0.18);border-color:#d4af37;box-shadow:0 0 28px rgba(212,175,55,0.4);}
.tbtn.rev{background:rgba(212,175,55,0.12);border-color:rgba(212,175,55,0.7);}
.tbtn.rev:hover{background:rgba(212,175,55,0.25);}
.bring{position:absolute;inset:-7px;border-radius:50%;border:0.5px solid rgba(212,175,55,0.2);animation:spnr 8s linear infinite;}
.bring2{position:absolute;inset:-14px;border-radius:50%;border:0.5px dashed rgba(212,175,55,0.1);animation:spnr 14s linear infinite reverse;}
@keyframes spnr{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.bicon{font-family:'Cinzel',serif;font-size:18px;color:#d4af37;line-height:1;transition:all 0.4s;}
.bhint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(212,175,55,0.38);letter-spacing:0.2em;transition:all 0.4s;}
.prow{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 30px 0;}
.plabel{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(212,175,55,0.33);letter-spacing:0.25em;transition:all 0.5s;}
.ptrack{width:230px;height:2px;background:rgba(212,175,55,0.1);border-radius:1px;overflow:hidden;}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#8B6914,#d4af37,#ffe57a);border-radius:1px;}
.btnrow{position:relative;z-index:3;display:flex;justify-content:center;gap:12px;padding:12px 20px 20px;min-height:52px;}
.go-btn{display:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.25em;color:#060006;background:linear-gradient(135deg,#d4af37,#ffe57a);border:none;border-radius:22px;padding:10px 26px;cursor:pointer;transition:all 0.3s;}
.go-btn:hover{box-shadow:0 0 28px rgba(212,175,55,0.7);transform:scale(1.05);}
.go-btn.show{display:inline-block;}
#fov{position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:14px;opacity:0;transition:opacity 0.5s;}

/* ── GAME SCREEN ── */
#game-screen{display:none;width:100%;max-width:700px;height:740px;position:relative;border-radius:14px;overflow:hidden;background:#080600;}
#game-canvas{display:block;width:100%;height:100%;}
#game-ui{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#FFD700;font-family:'Georgia',serif;font-size:13px;text-shadow:0 0 10px #FFD700;pointer-events:none;letter-spacing:2px;white-space:nowrap;}
#game-platcount{position:absolute;top:36px;left:50%;transform:translateX(-50%);color:rgba(255,215,0,0.7);font-family:'Georgia',serif;font-size:12px;pointer-events:none;letter-spacing:1px;}
#game-back{position:absolute;top:12px;left:14px;z-index:10;padding:8px 16px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.5);color:#FFD700;font-family:'Georgia',serif;font-size:12px;letter-spacing:1px;cursor:pointer;border-radius:20px;transition:background 0.15s;}
#game-back:hover{background:rgba(255,215,0,0.28);}
#game-retry{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:10;padding:12px 28px;background:rgba(255,215,0,0.15);border:2px solid rgba(255,215,0,0.6);color:#FFD700;font-family:'Georgia',serif;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:30px;text-shadow:0 0 8px #FFD700;transition:background 0.15s;}
#game-retry:active{background:rgba(255,215,0,0.4);}
#game-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);z-index:20;flex-direction:column;gap:16px;border-radius:14px;}
#game-overlay h1{color:#FFD700;font-family:'Georgia',serif;font-size:28px;text-shadow:0 0 20px #FFD700;}
#game-overlay p{color:rgba(255,215,0,0.7);font-size:14px;font-family:sans-serif;}
</style>
</head>
<body>

<div id="cursor">
<svg viewBox="0 0 16 16" width="48" height="48" image-rendering="pixelated" xmlns="http://www.w3.org/2000/svg">
  <rect x="7" y="0" width="2" height="2" fill="#4a2a00"/><rect x="8" y="1" width="3" height="1" fill="#3a1a00"/>
  <rect x="9" y="1" width="2" height="1" fill="#6aaa00"/><rect x="10" y="0" width="2" height="1" fill="#5a9000"/>
  <rect x="3" y="2" width="10" height="1" fill="#cc8800"/><rect x="2" y="3" width="12" height="1" fill="#dd9900"/>
  <rect x="1" y="4" width="14" height="1" fill="#eeaa00"/><rect x="1" y="5" width="14" height="1" fill="#ffbb11"/>
  <rect x="1" y="6" width="14" height="1" fill="#ffcc22"/><rect x="1" y="7" width="14" height="1" fill="#ffdd33"/>
  <rect x="1" y="8" width="14" height="1" fill="#ffcc22"/><rect x="1" y="9" width="14" height="1" fill="#ffbb11"/>
  <rect x="1" y="10" width="14" height="1" fill="#eeaa00"/><rect x="2" y="11" width="12" height="1" fill="#dd9900"/>
  <rect x="3" y="12" width="10" height="1" fill="#cc8800"/><rect x="4" y="13" width="8" height="1" fill="#bb7700"/>
  <rect x="5" y="14" width="6" height="1" fill="#aa6600"/><rect x="3" y="4" width="3" height="2" fill="#ffee88" opacity="0.7"/>
  <rect x="7" y="2" width="2" height="1" fill="#bb7700"/>
</svg>
</div>

<!-- ══════════════════════════════════════════════ -->
<!--  TRANSFORMATION SCREEN                         -->
<!-- ══════════════════════════════════════════════ -->
<div id="transform-screen">
<canvas id="bg-canvas"></canvas>
<canvas id="pc"></canvas>
<div class="header">
  <div class="header-sub">✦ idol transformation ✦</div>
  <h1>FOR THE FAIREST<br>GODDESS</h1>
  <div class="hdiv"><div class="hline"></div><div class="hgem"></div><div class="hline"></div></div>

<div class="stage">
<!-- LEFT: HYUN -->
<div class="char-wrap">
<div class="char-frame">
<img class="char-img char-img-before" id="bef-l" src="https://res.cloudinary.com/dob6nrs1w/image/upload/fl_attachment/v1780986483/be-hyun_fvxy2w.png"/>
<img class="char-img idol-img" id="aft-l" src="https://res.cloudinary.com/dob6nrs1w/image/upload/fl_attachment/v1780986483/af-hyun_cow6pi.png"/>

<img class="char-img idol-img" id="aft-r" src="https://res.cloudinary.com/dob6nrs1w/image/upload/fl_attachment/v1780986483/af-dain_vwsogq.png"/>

<!--  GAME SCREEN                                   -->
<!-- ══════════════════════════════════════════════ -->
<div id="game-screen">
  <canvas id="game-canvas"></canvas>
  <div id="game-ui">Arrow Keys / Tilt to Move</div>
  <div id="game-platcount">Photo 0 / 30</div>
  <button id="game-back" onclick="exitGame()">← Back</button>
  <button id="game-retry" onclick="restartGame()">↺ Retry</button>
  <div id="game-overlay">
    <h1>Bad Apple!</h1>
    <p>You passed all 30 photos</p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
/* ═══════════════════════════════════════
   TRANSFORMATION LOGIC
═══════════════════════════════════════ */
const app=document.getElementById('transform-screen');
const bgC=document.getElementById('bg-canvas'),pC=document.getElementById('pc');
const bgX=bgC.getContext('2d'),pX=pC.getContext('2d');
const befL=document.getElementById('bef-l'),befR=document.getElementById('bef-r');
const aftL=document.getElementById('aft-l'),aftR=document.getElementById('aft-r');
const pfill=document.getElementById('pfill'),plbl=document.getElementById('plbl');
const fov=document.getElementById('fov');
const bicon=document.getElementById('bicon'),bhint=document.getElementById('bhint');
const bhintTop=document.getElementById('bhint-top');
const goBtn=document.getElementById('go-btn'),tbtn=document.getElementById('tbtn');
let transformed=false,busy=false,stars=[],particles=[],blockParticles=false;

document.addEventListener('mousemove',e=>{
  const c=document.getElementById('cursor');
  c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';
});

function resize(){bgC.width=pC.width=app.offsetWidth;bgC.height=pC.height=app.offsetHeight;}
function initStars(){
  stars=[];
  for(let i=0;i<130;i++) stars.push({x:Math.random()*bgC.width,y:Math.random()*bgC.height,r:Math.random()*1.5+0.2,a:Math.random(),spd:Math.random()*0.007+0.002,gold:Math.random()<0.3});
}
class Pt{
  constructor(x,y,type){
    this.x=x;this.y=y;
    const a=Math.random()*Math.PI*2,s=Math.random()*7+1;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-3.5;
    this.life=1;this.decay=Math.random()*0.013+0.008;this.sz=Math.random()*9+2;
    const P={gold:['#d4af37','#ffe57a','#fff4b0','#ffcc44'],pink:['#ff88aa','#ffaacc','#ff66bb','#ffddee'],rainbow:['#ff4466','#ff8844','#ffcc44','#44cc88','#4488ff','#cc44ff'],sparkle:['#ffffff','#ffffaa','#d4af37','#ffaacc'],star:['#d4af37','#ffe57a','#ffffff']};
    const pal=P[type]||P.gold;
    this.col=pal[Math.floor(Math.random()*pal.length)];
    this.shape=Math.random()<0.3?'star':Math.random()<0.4?'heart':'circle';
    this.rot=Math.random()*Math.PI*2;this.rotS=(Math.random()-.5)*0.22;this.g=0.09;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=0.98;this.life-=this.decay;this.rot+=this.rotS;}
  draw(ctx){
    if(this.life<=0)return;
    ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.col;
    if(this.shape==='star'){dStar(ctx,0,0,this.sz*0.4,this.sz,5);}
    else if(this.shape==='heart'){dHeart(ctx,0,0,this.sz*0.7);}
    else{ctx.beginPath();ctx.arc(0,0,this.sz*0.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
function dStar(ctx,cx,cy,ir,or,pts){ctx.beginPath();for(let i=0;i<pts*2;i++){const a=(i*Math.PI)/pts-Math.PI/2,r=i%2===0?or:ir;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.fill();}
function dHeart(ctx,cx,cy,s){ctx.beginPath();ctx.moveTo(cx,cy+s*.3);ctx.bezierCurveTo(cx,cy-s*.3,cx-s,cy-s*.3,cx-s,cy);ctx.bezierCurveTo(cx-s,cy+s*.5,cx,cy+s*.8,cx,cy+s*.8);ctx.bezierCurveTo(cx,cy+s*.8,cx+s,cy+s*.5,cx+s,cy);ctx.bezierCurveTo(cx+s,cy-s*.3,cx,cy-s*.3,cx,cy+s*.3);ctx.fill();}
function burst(cx,cy,types,n){if(blockParticles)return;for(let i=0;i<n;i++){const t=types[Math.floor(Math.random()*types.length)];particles.push(new Pt(cx,cy,t));}}
function bigBurst(cx,cy){
  const waves=[{t:['gold','sparkle'],n:70},{t:['pink','rainbow'],n:60},{t:['star','sparkle'],n:50}];
  waves.forEach((w,i)=>setTimeout(()=>burst(cx,cy,w.t,w.n),i*130));
  setTimeout(()=>{burst(cx-110,cy-50,['rainbow','sparkle'],35);burst(cx+110,cy-50,['rainbow','sparkle'],35);},320);
  setTimeout(()=>{burst(cx,cy-90,['gold','star'],45);burst(cx-130,cy,['pink'],28);burst(cx+130,cy,['pink'],28);},540);
  setTimeout(()=>burst(cx,cy,['sparkle','star','gold'],60),860);
}
function bgLoop(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  stars.forEach(s=>{s.a+=s.spd;if(s.a>1||s.a<0)s.spd*=-1;bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,Math.PI*2);bgX.fillStyle=s.gold?`rgba(212,175,55,${s.a*0.6})`:`rgba(255,255,255,${s.a*0.42})`;bgX.fill();});
  pX.clearRect(0,0,pC.width,pC.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.update();p.draw(pX);});
  if(document.getElementById('transform-screen').style.display!=='none') requestAnimationFrame(bgLoop);
}
function kickIt(){
  goBtn.style.transform='scale(0.93)';
  setTimeout(()=>goBtn.style.transform='',200);
  setTimeout(()=>showGame(),220);
}
function handleBtn(){if(busy)return;if(!transformed)doTransform();else doRevert();}
function doRevert(){
  busy=true;
  befL.classList.remove('hidden');befR.classList.remove('hidden');
  aftL.classList.remove('visible');aftR.classList.remove('visible');
  befL.style.filter=befR.style.filter='';aftL.style.filter=aftR.style.filter='';
  pfill.style.transition='width 0.7s ease';pfill.style.width='0%';
  plbl.textContent='star power';plbl.style.color='';
  tbtn.classList.remove('rev');
  bicon.textContent='✦';bhint.textContent='클릭';bhintTop.textContent='아이돌 변신';
  goBtn.classList.remove('show');
  blockParticles=true;particles=[];
  transformed=false;busy=false;
}
function doTransform(){
  busy=true;blockParticles=false;
  const cx=pC.width/2,cy=pC.height*.44;
  let t=0;
  pfill.style.transition='none';pfill.style.width='0%';
  const amb=setInterval(()=>{if(t>90){clearInterval(amb);return;}burst(cx+(Math.random()-.5)*170,cy+(Math.random()-.5)*110,['gold','pink'],9);},75);
  function step(){
    t++;
    pfill.style.width=(Math.min(t/90,1)*100)+'%';
    if(t===15){fov.style.background='rgba(255,180,220,0.2)';fov.style.opacity='1';setTimeout(()=>fov.style.opacity='0',400);}
    if(t===35){burst(cx,cy,['rainbow','sparkle'],55);burst(cx-90,cy+20,['pink'],22);burst(cx+90,cy+20,['pink'],22);}
    if(t===52){befL.style.filter=befR.style.filter='brightness(4) saturate(0) sepia(0.3) hue-rotate(280deg)';befL.style.transition=befR.style.transition='filter 0.4s';burst(cx,cy,['gold','star'],65);}
    if(t===68){
      befL.classList.add('hidden');befR.classList.add('hidden');
      aftL.classList.add('visible');aftR.classList.add('visible');
      aftL.style.filter='drop-shadow(0 0 18px rgba(255,100,180,0.9)) drop-shadow(0 0 36px rgba(212,175,55,0.6)) brightness(1.12)';
      aftR.style.filter='drop-shadow(0 0 18px rgba(255,150,60,0.9)) drop-shadow(0 0 36px rgba(212,175,55,0.6)) brightness(1.12)';
      bigBurst(cx,cy);
    }
    if(t===72){fov.style.background='rgba(255,220,255,0.35)';fov.style.opacity='1';setTimeout(()=>fov.style.opacity='0',350);}
    if(t>=90){
      pfill.style.width='100%';
      plbl.textContent='✦ GODDESS POWER ✦';plbl.style.color='rgba(212,175,55,0.85)';
      bicon.textContent='↩';bhint.textContent='뒤로가기';bhintTop.textContent='변신 완료!';
      tbtn.classList.add('rev');goBtn.classList.add('show');
      transformed=true;busy=false;return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
resize();initStars();
requestAnimationFrame(bgLoop);
window.addEventListener('resize',()=>{resize();initStars();});

/* ═══════════════════════════════════════
   GAME LOGIC
═══════════════════════════════════════ */
let gameRenderer=null,gameScene=null,gameCamera=null,gameWorld=null;
let gameRunning=false,gameAnimId=null;

function showGame(){
  document.getElementById('cursor').style.display='none';
  document.body.style.cursor='default';
  document.getElementById('transform-screen').style.display='none';
  document.getElementById('game-screen').style.display='block';
  initGame();
}
function exitGame(){
  stopGame();
  document.getElementById('game-screen').style.display='none';
  document.getElementById('transform-screen').style.display='block';
  resize();initStars();
  requestAnimationFrame(bgLoop);
}
function restartGame(){
  stopGame();
  document.getElementById('game-overlay').style.display='none';
  document.getElementById('game-platcount').textContent='Photo 0 / 30';
  initGame();
}
function stopGame(){
  gameRunning=false;
  if(gameAnimId) cancelAnimationFrame(gameAnimId);
  if(gameRenderer){ gameRenderer.dispose(); gameRenderer=null; }
  gameScene=null;gameCamera=null;gameWorld=null;
}

function initGame(){
  const canvas=document.getElementById('game-canvas');
  const W=canvas.offsetWidth||700, H=canvas.offsetHeight||740;

  gameRenderer=new THREE.WebGLRenderer({canvas,antialias:true});
  gameRenderer.setPixelRatio(devicePixelRatio);
  gameRenderer.setSize(W,H);
  gameRenderer.shadowMap.enabled=true;
  gameRenderer.shadowMap.type=THREE.PCFSoftShadowMap;
  gameRenderer.toneMapping=THREE.ACESFilmicToneMapping;
  gameRenderer.toneMappingExposure=1.3;

  gameScene=new THREE.Scene();
  gameScene.background=new THREE.Color(0x080600);
  gameCamera=new THREE.PerspectiveCamera(60,W/H,0.1,600);

  gameWorld=new CANNON.World();
  gameWorld.gravity.set(0,-6,0);
  gameWorld.broadphase=new CANNON.NaiveBroadphase();
  gameWorld.solver.iterations=20;
  const bMat=new CANNON.Material('b');
  gameWorld.addContactMaterial(new CANNON.ContactMaterial(bMat,bMat,{restitution:0.18,friction:0.75,contactEquationStiffness:1e7,contactEquationRelaxation:4}));

  gameScene.add(new THREE.AmbientLight(0xfff4cc,1.4));
  const dl=new THREE.DirectionalLight(0xfffbe6,3.5);
  dl.position.set(6,16,8);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
  dl.shadow.camera.near=1;dl.shadow.camera.far=200;gameScene.add(dl);
  const rl=new THREE.DirectionalLight(0xFFCC44,1.6);rl.position.set(-6,3,-6);gameScene.add(rl);
  const tl=new THREE.DirectionalLight(0xffffff,2.0);tl.position.set(0,20,2);gameScene.add(tl);

  const R=0.65;
  const sGeo=new THREE.SphereGeometry(R,64,64);
  (function(){
    const pos=sGeo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
      const len=Math.sqrt(x*x+y*y+z*z),ny=y/len,flatY=y*0.96;
      const belly=1.0+0.04*Math.exp(-ny*ny*4.0);
      const micro=0.007*Math.sin(x*14+z*11)+0.005*Math.cos(z*13+y*9);
      const topDent=ny>0.6?-0.10*Math.pow(ny-0.6,2)*10:0;
      const r=R*belly*(1+micro)+topDent;
      pos.setXYZ(i,x/len*r,flatY/len*r,z/len*r);
    }
    sGeo.computeVertexNormals();
  })();
  const gMat=new THREE.MeshStandardMaterial({color:0xF0B800,metalness:0.95,roughness:0.18,emissive:new THREE.Color(0xC07800),emissiveIntensity:0.12});
  const aMesh=new THREE.Mesh(sGeo,gMat);aMesh.castShadow=true;gameScene.add(aMesh);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.048,0.18,10),new THREE.MeshStandardMaterial({color:0xC8860A,metalness:0.7,roughness:0.4}));
  stem.position.set(0.01,R*0.80,0);stem.rotation.z=0.08;aMesh.add(stem);
  const aGlow=new THREE.PointLight(0xFFD040,2.2,9);aMesh.add(aGlow);

  const aBody=new CANNON.Body({mass:2,shape:new CANNON.Sphere(R),material:bMat});
  aBody.position.set(0,8,0);aBody.linearDamping=0.35;aBody.angularDamping=0.1;
  aBody.angularVelocity.set(1.2,0.5,1.8);gameWorld.addBody(aBody);

  const SPARK=500;
  function mkSp(color,size,opacity){
    const geo=new THREE.BufferGeometry(),arr=new Float32Array(SPARK*3);
    for(let i=0;i<SPARK;i++){arr[i*3]=(Math.random()-0.5)*80;arr[i*3+1]=(Math.random()-0.5)*120;arr[i*3+2]=(Math.random()-0.5)*50;}
    geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const mat=new THREE.PointsMaterial({color,size,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false});
    gameScene.add(new THREE.Points(geo,mat));return{geo,mat,arr};
  }
  const sp1=mkSp(0xFFE44D,0.28,1.0),sp2=mkSp(0xFFF8DC,0.12,0.6);
  const spV=Array.from({length:SPARK},()=>({x:(Math.random()-0.5)*0.03,y:Math.random()*0.05+0.01,z:(Math.random()-0.5)*0.02}));

  const TRAIL=40,tArr=new Float32Array(TRAIL*3),tGeo=new THREE.BufferGeometry();
  tGeo.setAttribute('position',new THREE.BufferAttribute(tArr,3));
  const tMat=new THREE.PointsMaterial({color:0xFFCC00,size:0.22,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false});
  gameScene.add(new THREE.Points(tGeo,tMat));
  const tBuf=[];

  const BURST=120;
  function mkPS(color,size){
    const geo=new THREE.BufferGeometry(),arr=new Float32Array(BURST*3);
    geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const mat=new THREE.PointsMaterial({color,size,transparent:true,opacity:1.0,blending:THREE.AdditiveBlending,depthWrite:false});
    gameScene.add(new THREE.Points(geo,mat));
    const pts=Array.from({length:BURST},()=>({x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,maxLife:0,active:false}));
    return{geo,mat,arr,particles:pts};
  }
  const bSys=mkPS(0xFFEE55,0.5),rSys=mkPS(0xFFFFAA,0.35);
  function spawnB(sys,px,py,pz,count,speed,spread){
    let n=0;
    for(let i=0;i<BURST&&n<count;i++){
      const p=sys.particles[i];if(p.active)continue;
      const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI,s=speed*(0.4+Math.random()*0.9);
      p.x=px;p.y=py;p.z=pz;p.vx=Math.sin(ph)*Math.cos(th)*s*spread;p.vy=Math.abs(Math.cos(ph))*s*0.8+0.5;p.vz=Math.sin(ph)*Math.sin(th)*s*spread;
      p.life=0;p.maxLife=0.5+Math.random()*0.35;p.active=true;n++;
    }
  }
  function updB(sys,dt,grav){
    for(let i=0;i<BURST;i++){
      const p=sys.particles[i];
      if(!p.active){sys.arr[i*3+1]=-9999;continue;}
      p.life+=dt;if(p.life>=p.maxLife){p.active=false;sys.arr[i*3+1]=-9999;continue;}
      p.vy-=grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
      sys.arr[i*3]=p.x;sys.arr[i*3+1]=p.y;sys.arr[i*3+2]=p.z;
    }
    const ratio=1-sys.particles.filter(p=>p.active).length/BURST;
    sys.mat.opacity=Math.max(0.1,1.0-ratio*0.6);sys.geo.attributes.position.needsUpdate=true;
  }

  const fMs=[],fBs=[];let shattered=false;
  function shatter(px,py,pz){
    shattered=true;aMesh.visible=false;gameWorld.removeBody(aBody);
    document.getElementById('game-overlay').style.display='flex';
    for(let i=0;i<40;i++){
      const sz=Math.random()*0.25+0.08;
      const geo=new THREE.IcosahedronGeometry(sz,0);
      const mat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.12+Math.random()*0.05,1.0,0.4+Math.random()*0.25),metalness:0.9,roughness:0.15,emissive:new THREE.Color(0xAA6600),emissiveIntensity:0.3});
      const mesh=new THREE.Mesh(geo,mat);mesh.position.set(px,py,pz);mesh.castShadow=true;gameScene.add(mesh);fMs.push(mesh);
      const body=new CANNON.Body({mass:0.3,shape:new CANNON.Sphere(sz*0.6),material:bMat});
      body.position.set(px,py,pz);body.velocity.set((Math.random()-0.5)*8,Math.random()*6+2,(Math.random()-0.5)*8);
      body.angularVelocity.set((Math.random()-0.5)*12,(Math.random()-0.5)*12,(Math.random()-0.5)*12);
      body.linearDamping=0.2;body.angularDamping=0.1;gameWorld.addBody(body);fBs.push(body);
    }
    const flash=new THREE.PointLight(0xFFDD00,20,25);flash.position.set(px,py,pz);gameScene.add(flash);
    setTimeout(()=>gameScene.remove(flash),400);
    spawnB(bSys,px,py,pz,BURST,6,2.5);spawnB(rSys,px,py,pz,BURST,4,3.5);
  }

  const PLAT_SPACING=16,MAX_PLAT=30;
  const floorY=-PLAT_SPACING*(MAX_PLAT-1)-20;
  const flB=new CANNON.Body({mass:0,material:bMat});
  flB.addShape(new CANNON.Plane());flB.position.set(0,floorY,0);
  flB.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
  gameWorld.addBody(flB);

  const loader = new THREE.TextureLoader();
  const pTexs = Array.from({length: 3}, (_, i) =>
    loader.load(`./platforms/photo${i+1}.webp`)
  );
  const plats=[];const TILT=Math.PI/4;
  for(let i=0;i<MAX_PLAT;i++){
    const w=11+Math.random()*3,h=0.4,d=7+Math.random()*2;
    const geo=new THREE.BoxGeometry(w,h,d);
    const mat=new THREE.MeshStandardMaterial({map:pTexs[i%3],roughness:0.5,metalness:0.15});
    const mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;mesh.castShadow=true;
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xFFD700,transparent:true,opacity:0.8})));
    mesh.rotation.x=TILT;
    const x=(Math.random()-0.5)*10,y=-PLAT_SPACING*i,z=(Math.random()-0.5)*4;
    mesh.position.set(x,y,z);
    const body=new CANNON.Body({mass:0,material:bMat});
    body.addShape(new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)));
    body.position.set(x,y,z);body.quaternion.setFromEuler(TILT,0,0);
    gameScene.add(mesh);gameWorld.addBody(body);
    plats.push({mesh,body,passed:false});
  }

  const keys={};
  const keyDown=e=>{keys[e.code]=true;e.preventDefault();};
  const keyUp=e=>{keys[e.code]=false;};
  document.addEventListener('keydown',keyDown);
  document.addEventListener('keyup',keyUp);

  let tiltX=0,tiltZ=0,gyroOn=false;
  const oriH=e=>{if(!gyroOn)return;tiltX=Math.max(-25,Math.min(25,e.gamma||0));tiltZ=Math.max(-25,Math.min(25,(e.beta||0)-45));};
  window.addEventListener('deviceorientation',oriH,true);

  function handleInput(){
    if(shattered)return;
    const f=5;
    if(keys['ArrowUp'])    aBody.applyImpulse(new CANNON.Vec3(0,0,-f),aBody.position);
    if(keys['ArrowDown'])  aBody.applyImpulse(new CANNON.Vec3(0,0, f),aBody.position);
    if(keys['ArrowLeft'])  aBody.applyImpulse(new CANNON.Vec3(-f,0,0),aBody.position);
    if(keys['ArrowRight']) aBody.applyImpulse(new CANNON.Vec3( f,0,0),aBody.position);
    if(gyroOn&&(Math.abs(tiltX)>2||Math.abs(tiltZ)>2)) aBody.applyForce(new CANNON.Vec3(tiltX*0.18,0,tiltZ*0.18),aBody.position);
    const b=13;
    if(Math.abs(aBody.position.x)>b){aBody.position.x=Math.sign(aBody.position.x)*b;aBody.velocity.x=0;}
    if(Math.abs(aBody.position.z)>b){aBody.position.z=Math.sign(aBody.position.z)*b;aBody.velocity.z=0;}
    if(aBody.velocity.y<-10)aBody.velocity.y=-10;
    const lv=Math.hypot(aBody.velocity.x,aBody.velocity.z);
    if(lv>5){const s=5/lv;aBody.velocity.x*=s;aBody.velocity.z*=s;}
  }

  const pcEl=document.getElementById('game-platcount');
  let gt=0,lastT=performance.now(),prevVY=0,pPassed=0;
  gameRunning=true;

  function gLoop(){
    if(!gameRunning)return;
    gameAnimId=requestAnimationFrame(gLoop);
    const now=performance.now(),dt=Math.min((now-lastT)/1000,0.05);
    lastT=now;gt+=dt;
    handleInput();gameWorld.step(1/60);
    if(!shattered){
      aMesh.position.copy(aBody.position);aMesh.quaternion.copy(aBody.quaternion);
      const curVY=aBody.velocity.y;
      if(prevVY<-2.5&&curVY>0.2){
        const imp=Math.abs(prevVY);
        spawnB(bSys,aBody.position.x,aBody.position.y,aBody.position.z,Math.min(60,Math.floor(imp*5)),imp*0.5,1.2);
        spawnB(rSys,aBody.position.x,aBody.position.y,aBody.position.z,Math.min(40,Math.floor(imp*3)),imp*0.35,2.0);
        const fl=new THREE.PointLight(0xFFDD44,8,12);fl.position.copy(aBody.position);gameScene.add(fl);
        setTimeout(()=>gameScene&&gameScene.remove(fl),200);
      }
      prevVY=curVY;
      if(aBody.position.y<=floorY+R+0.5) shatter(aBody.position.x,aBody.position.y,aBody.position.z);
      // fell out of bounds — too far sideways while falling
      if(!shattered && aBody.velocity.y < -0.5 &&
         (Math.abs(aBody.position.x) > 18 || Math.abs(aBody.position.z) > 18)){
        shattered=true; aMesh.visible=false; gameWorld.removeBody(aBody);
        document.getElementById('game-overlay').style.display='flex';
        document.getElementById('game-overlay').querySelector('h1').textContent='Missed!';
        document.getElementById('game-overlay').querySelector('p').textContent='The apple missed the platform. Try again!';
      }
      plats.forEach(p=>{
        if(!p.passed&&aBody.position.y<p.body.position.y-5){
          p.passed=true;pPassed++;pcEl.textContent='Photo '+pPassed+' / '+MAX_PLAT;
        }
      });
      tBuf.unshift({x:aBody.position.x,y:aBody.position.y,z:aBody.position.z});
      if(tBuf.length>TRAIL)tBuf.pop();
      for(let i=0;i<TRAIL;i++){const p=tBuf[i]||tBuf[0];tArr[i*3]=p.x;tArr[i*3+1]=p.y;tArr[i*3+2]=p.z;}
      tGeo.attributes.position.needsUpdate=true;
      const fSpd=Math.max(0,-aBody.velocity.y);
      tMat.size=0.22+fSpd*0.06;tMat.opacity=Math.min(1.0,0.5+fSpd*0.1);
      aGlow.intensity=3.5+1.5*Math.sin(gt*4);
    }
    fMs.forEach((m,i)=>{m.position.copy(fBs[i].position);m.quaternion.copy(fBs[i].quaternion);});
    updB(bSys,dt,9);updB(rSys,dt,7);
    const camY=shattered?floorY+5:aBody.position.y;
    for(let i=0;i<SPARK;i++){
      sp1.arr[i*3+1]+=spV[i].y;sp1.arr[i*3]+=spV[i].x;sp1.arr[i*3+2]+=spV[i].z;
      if(sp1.arr[i*3+1]>camY+60)sp1.arr[i*3+1]=camY-60;
      if(sp1.arr[i*3+1]<camY-65)sp1.arr[i*3+1]=camY+55;
      sp2.arr[i*3+1]+=0.012;if(sp2.arr[i*3+1]>camY+60)sp2.arr[i*3+1]=camY-60;
    }
    sp1.geo.attributes.position.needsUpdate=true;sp2.geo.attributes.position.needsUpdate=true;
    sp1.mat.opacity=0.85+0.15*Math.sin(gt*2.5);
    const tY=shattered?floorY+5:aBody.position.y;
    gameCamera.position.set(shattered?0:aBody.position.x*0.4,tY+7,shattered?15:aBody.position.z+13);
    gameCamera.lookAt(shattered?0:aBody.position.x,tY,shattered?0:aBody.position.z);
    gameRenderer.render(gameScene,gameCamera);
  }
  gLoop();

  // cleanup listeners on exit
  const origExit=window.exitGame;
  window.exitGame=function(){
    document.removeEventListener('keydown',keyDown);
    document.removeEventListener('keyup',keyUp);
    window.removeEventListener('deviceorientation',oriH,true);
    stopGame();
    document.getElementById('cursor').style.display='block';
    document.body.style.cursor='none';
    resize();initStars();requestAnimationFrame(bgLoop);
  };
}

window.addEventListener('resize',()=>{
  if(gameRenderer){
    const c=document.getElementById('game-canvas');
    gameCamera.aspect=c.offsetWidth/c.offsetHeight;
    gameCamera.updateProjectionMatrix();
    gameRenderer.setSize(c.offsetWidth,c.offsetHeight);
  }
});
</script>
</body>
</html>
