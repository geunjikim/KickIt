<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOR THE FAIREST GODDESS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a2e10;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;}

/* ══ CURSOR ══ */
#cursor{position:fixed;width:48px;height:48px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);image-rendering:pixelated;}
@media(hover:none){#cursor{display:none!important;}}

/* ══ TRANSFORM SCREEN ══ */
#transform-screen{width:100%;max-width:700px;min-height:100vh;min-height:100dvh;background:#243820;position:relative;overflow:hidden;border-radius:0;cursor:none;}
@media(min-width:700px){#transform-screen{min-height:740px;border-radius:14px;}}
@media(hover:none){#transform-screen{cursor:auto;}}
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
#pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.header{position:relative;z-index:2;text-align:center;padding:24px 20px 4px;}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:0.5em;color:rgba(180,240,100,0.6);margin-bottom:4px;text-transform:uppercase;}
.header h1{font-family:'Cinzel',serif;font-size:20px;font-weight:600;letter-spacing:0.13em;color:#b4f040;line-height:1.35;}
.hdiv{display:flex;align-items:center;justify-content:center;gap:10px;margin:7px auto 0;width:240px;}
.hline{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(180,240,100,0.5),transparent);}
.hgem{width:5px;height:5px;background:#b4f040;transform:rotate(45deg);}
.stage{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:10px 4px 0;min-height:400px;}
.char-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.char-label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.22em;color:rgba(180,240,100,0.9);margin-top:3px;}
.char-frame{width:160px;height:340px;position:relative;}
@media(min-width:500px){.char-frame{width:190px;height:380px;}}
.char-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity 0.9s ease,filter 1.1s ease;}
.idol-img{opacity:0;}.idol-img.visible{opacity:1;}.char-img-before.hidden{opacity:0;}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-bottom:26px;}
.tbtn{width:56px;height:56px;border-radius:50%;background:rgba(180,240,100,0.08);border:1px solid rgba(180,240,100,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
@media(hover:hover){.tbtn{cursor:none;}}
.tbtn:hover{background:rgba(180,240,100,0.2);border-color:#b4f040;box-shadow:0 0 28px rgba(180,240,100,0.4);}
.tbtn.rev{background:rgba(180,240,100,0.12);border-color:rgba(180,240,100,0.7);}
.bring{position:absolute;inset:-7px;border-radius:50%;border:0.5px solid rgba(180,240,100,0.2);animation:spnr 8s linear infinite;}
.bring2{position:absolute;inset:-14px;border-radius:50%;border:0.5px dashed rgba(180,240,100,0.1);animation:spnr 14s linear infinite reverse;}
@keyframes spnr{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.bicon{font-family:'Cinzel',serif;font-size:18px;color:#b4f040;line-height:1;transition:all 0.4s;}
.bhint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(180,240,100,0.5);letter-spacing:0.2em;transition:all 0.4s;}
.prow{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 30px 0;}
.plabel{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(180,240,100,0.45);letter-spacing:0.25em;transition:all 0.5s;}
.ptrack{width:230px;height:2px;background:rgba(180,240,100,0.12);border-radius:1px;overflow:hidden;}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#5aaa20,#b4f040,#dcff90);border-radius:1px;}
.btnrow{position:relative;z-index:3;display:flex;justify-content:center;gap:12px;padding:12px 20px 20px;min-height:52px;}
.go-btn{display:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.25em;color:#1a2e10;background:linear-gradient(135deg,#b4f040,#dcff90);border:none;border-radius:22px;padding:12px 28px;cursor:pointer;transition:all 0.3s;-webkit-tap-highlight-color:transparent;}
.go-btn:hover{box-shadow:0 0 28px rgba(180,240,100,0.7);transform:scale(1.05);}
.go-btn.show{display:inline-block;}
#fov{position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:14px;opacity:0;transition:opacity 0.5s;}

/* ══ BATTLE SCREEN (Undertale-style dodge) ══ */
#asmr-screen{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:100;font-family:'Press Start 2P',monospace;}
.battle-root{position:absolute;inset:0;display:flex;flex-direction:column;background:#0e1a0a;overflow:hidden;}
.battle-bg{position:absolute;inset:0;pointer-events:none;opacity:0.07;background-image:linear-gradient(#b4f040 1px,transparent 1px),linear-gradient(90deg,#b4f040 1px,transparent 1px);background-size:10px 10px;}

.battle-hud{position:relative;z-index:5;display:flex;justify-content:flex-end;padding:14px 16px 0;}
.hp-bar-row{position:relative;z-index:4;display:flex;justify-content:center;padding:16px 0 0;}
.hp-row{display:flex;gap:6px;}
.hp-heart{display:inline-flex;color:#fff;transition:color 0.2s,opacity 0.2s;filter:drop-shadow(0 0 4px rgba(255,255,255,0.5));}
.hp-heart.lost{color:rgba(255,255,255,0.2);filter:none;}
.score-box{font-size:8px;color:rgba(180,240,100,0.7);letter-spacing:0.1em;text-align:right;line-height:1.7;}
.score-box b{color:#dcff90;font-size:9px;}

.attacker-stage{position:relative;z-index:4;display:flex;flex-direction:row;justify-content:center;align-items:flex-end;gap:18px;padding:6px 10px 0;min-height:0;}
.attacker-slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
.attacker-sprite{display:block;max-height:22vh;width:auto;object-fit:contain;filter:drop-shadow(0 0 10px rgba(180,240,100,0.45));}
.attacker-sprite.pop{animation:attackerPop 0.32s ease;}
.attacker-sprite.lunge{animation:attackerLunge 0.32s ease;}
@keyframes attackerLunge{
  0%{filter:drop-shadow(0 0 10px rgba(180,240,100,0.45));}
  30%{transform:scale(1.07) translateY(-5px);filter:brightness(1.4) drop-shadow(0 0 20px rgba(220,255,144,0.85));}
  100%{transform:scale(1) translateY(0);filter:drop-shadow(0 0 10px rgba(180,240,100,0.45));}
}
@keyframes attackerPop{0%{transform:scale(0.45);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);opacity:1;}}
.attacker-name{font-size:9px;letter-spacing:0.22em;color:#b4f040;}

.battle-wrap{position:relative;z-index:3;flex:1;display:flex;align-items:flex-start;justify-content:center;padding:4px 10px 10px;min-height:0;}

.joystick-zone{display:none;position:relative;z-index:6;align-items:center;justify-content:center;padding:8px 0 16px;flex-shrink:0;}
@media (hover:none) and (pointer:coarse){
  .joystick-zone{display:flex;}
}
.joystick-base{position:relative;width:84px;height:84px;border-radius:50%;border:2px solid rgba(180,240,100,0.32);background:rgba(180,240,100,0.05);touch-action:none;}
.joystick-thumb{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:rgba(220,255,176,0.3);border:1.5px solid rgba(220,255,176,0.65);transition:transform 0.05s linear;}
#battle-canvas{image-rendering:pixelated;border:3px solid #b4f040;box-shadow:0 0 22px rgba(180,240,100,0.3);background:#0a140a;touch-action:none;cursor:none;}
@media(hover:none){#battle-canvas{cursor:auto;}}

.turn-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);z-index:8;background:#0e1a0a;border:2px solid #b4f040;padding:14px 22px;font-size:11px;color:#dcff90;letter-spacing:0.12em;opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;white-space:nowrap;}
.turn-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

.battle-overlay{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(8,14,6,0.92);text-align:center;padding:0 24px;}
.battle-overlay.show{display:flex;}
.battle-overlay h2{font-size:17px;color:#dcff90;letter-spacing:0.1em;}
.battle-overlay p{font-size:9px;color:rgba(180,240,100,0.8);letter-spacing:0.08em;line-height:1.6;}
.retry-btn{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:0.12em;color:#0e1a0a;background:linear-gradient(135deg,#b4f040,#dcff90);border:none;padding:12px 24px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:4px;}
.retry-btn:active{transform:scale(0.95);}

/* KICK IT 진입 인트로 카드 */
.kickit-intro{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(6,12,5,0);opacity:0;}
.kickit-intro.show{animation:kiBgFlash 1.3s ease forwards;}
.kickit-intro .ki-en{position:absolute;font-family:'Press Start 2P',monospace;font-weight:700;font-size:11vw;color:transparent;-webkit-text-stroke:1.5px rgba(180,240,100,0.55);letter-spacing:0.06em;white-space:nowrap;opacity:0;}
.kickit-intro .ki-kr{position:relative;font-family:'Press Start 2P',monospace;font-size:18px;color:#dcff90;letter-spacing:0.1em;text-shadow:0 0 18px rgba(180,240,100,0.95),0 2px 0 #0e1a0a;opacity:0;white-space:nowrap;}
.kickit-intro.show .ki-en{animation:kiEnFlash 1.3s ease forwards;}
.kickit-intro.show .ki-kr{animation:kiKrPunch 1.3s ease forwards;}
@keyframes kiBgFlash{0%{opacity:0;background:rgba(6,12,5,0);}6%{opacity:1;background:rgba(6,12,5,0.55);}80%{opacity:1;background:rgba(6,12,5,0.55);}100%{opacity:0;background:rgba(6,12,5,0);}}
@keyframes kiEnFlash{0%{opacity:0;transform:scale(1.5);}14%{opacity:0.55;transform:scale(1);}78%{opacity:0.55;}100%{opacity:0;}}
@keyframes kiKrPunch{0%{opacity:0;transform:scale(0.5) rotate(-3deg);}18%{opacity:1;transform:scale(1.12) rotate(1deg);}28%{transform:scale(1) rotate(0);}76%{opacity:1;}100%{opacity:0;transform:scale(0.92);}}

/* back button */
#asmr-back{position:fixed;top:14px;left:14px;z-index:200;padding:8px 14px;background:rgba(180,240,100,0.08);border:1px solid rgba(180,240,100,0.35);color:rgba(220,255,144,0.85);font-family:'Press Start 2P',monospace;font-size:7px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:4px;}
#asmr-back:active{opacity:0.5;}

/* pixel particles */
.pp{position:absolute;width:6px;height:6px;pointer-events:none;image-rendering:pixelated;animation:pa 0.4s steps(4) forwards;}
@keyframes pa{0%{opacity:1;transform:translate(0,0);}100%{opacity:0;transform:translate(var(--tx),var(--ty));}}

/* unlock banner */
#unlock-banner{position:fixed;top:-56px;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;background:#7dc940;padding:10px 16px;cursor:pointer;box-shadow:none;transition:top 0.35s steps(6);font-family:'Press Start 2P',monospace;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursor">
<svg viewBox="0 0 16 16" width="48" height="48" image-rendering="pixelated" xmlns="http://www.w3.org/2000/svg">
  <rect x="7" y="0" width="2" height="2" fill="#3a6010"/><rect x="8" y="1" width="3" height="1" fill="#2a4a08"/>
  <rect x="9" y="1" width="2" height="1" fill="#5aaa20"/><rect x="10" y="0" width="2" height="1" fill="#4a9010"/>
  <rect x="3" y="2" width="10" height="1" fill="#6ab830"/><rect x="2" y="3" width="12" height="1" fill="#7acc40"/>
  <rect x="1" y="4" width="14" height="1" fill="#88dd50"/><rect x="1" y="5" width="14" height="1" fill="#96ee5a"/>
  <rect x="1" y="6" width="14" height="1" fill="#a0f060"/><rect x="1" y="7" width="14" height="1" fill="#aaff66"/>
  <rect x="1" y="8" width="14" height="1" fill="#a0f060"/><rect x="1" y="9" width="14" height="1" fill="#96ee5a"/>
  <rect x="1" y="10" width="14" height="1" fill="#88dd50"/><rect x="2" y="11" width="12" height="1" fill="#7acc40"/>
  <rect x="3" y="12" width="10" height="1" fill="#6ab830"/><rect x="4" y="13" width="8" height="1" fill="#5aaa28"/>
  <rect x="5" y="14" width="6" height="1" fill="#4a9020"/>
  <rect x="3" y="4" width="3" height="2" fill="#ccffaa" opacity="0.7"/>
  <rect x="7" y="2" width="2" height="1" fill="#5aaa20"/>
</svg>
</div>

<!-- TRANSFORM SCREEN -->
<div id="transform-screen">
<canvas id="bg-canvas"></canvas>
<canvas id="pc"></canvas>
<div class="header">
  <div class="header-sub">✦ idol transformation ✦</div>
  <h1>FOR THE FAIREST<br>GODDESS</h1>
  <div class="hdiv"><div class="hline"></div><div class="hgem"></div><div class="hline"></div></div>
</div>
<div class="stage">
  <div class="char-wrap">
    <div class="char-frame">
      <img class="char-img-before" id="bef-l" src="./images/be-hyun.png"/>
      <img class="idol-img" id="aft-l" src="./images/af-hyun.png"/>
    </div>
    <div class="char-label">HYUN</div>
  </div>
  <div class="center-col">
    <div class="bhint" id="bhint-top">아이돌 변신</div>
    <div class="tbtn" id="tbtn" onclick="handleBtn()">
      <div class="bring"></div><div class="bring2"></div>
      <span class="bicon" id="bicon">✦</span>
    </div>
    <div class="bhint" id="bhint">클릭</div>
  </div>
  <div class="char-wrap">
    <div class="char-frame">
      <img class="char-img-before" id="bef-r" src="./images/be-dain.png"/>
      <img class="idol-img" id="aft-r" src="./images/af-dain.png"/>
    </div>
    <div class="char-label">DA-IN</div>
  </div>
</div>
<div class="prow">
  <div class="plabel" id="plbl">star power</div>
  <div class="ptrack"><div class="pfill" id="pfill"></div></div>
</div>
<div class="btnrow">
  <button id="go-btn" class="go-btn" onclick="kickIt()">KICK IT! ✦</button>
</div>
<div id="fov"></div>
</div>

<!-- BATTLE SCREEN -->
<div id="asmr-screen">
  <button id="asmr-back" onclick="exitAsmr()">← BACK</button>
  <div class="battle-root">
    <div class="battle-bg"></div>
    <div class="battle-hud">
      <div class="score-box">STAGE <b id="roundNum">1</b><br>TIME <b id="timeNum">0</b>s</div>
    </div>
    <div class="attacker-stage">
      <div class="attacker-slot" id="slotHyun">
        <img class="attacker-sprite" id="spriteHyun" src="./images/hyun_attack01.png" alt="HYUN">
        <span class="attacker-name">HYUN</span>
      </div>
      <div class="attacker-slot" id="slotDain" style="display:none">
        <img class="attacker-sprite" id="spriteDain" src="./images/dain_attack01.png" alt="DA-IN">
        <span class="attacker-name">DA-IN</span>
      </div>
    </div>
    <div class="hp-bar-row">
      <div class="hp-row" id="hpRow"></div>
    </div>
    <div class="battle-wrap">
      <canvas id="battle-canvas"></canvas>
    </div>
    <div class="joystick-zone" id="joystickZone">
      <div class="joystick-base" id="joyBase">
        <div class="joystick-thumb" id="joyThumb"></div>
      </div>
    </div>
    <div class="turn-banner" id="turnBanner"></div>
    <div class="battle-overlay" id="battleOverlay">
      <h2 id="overlayTitle">GAME OVER</h2>
      <p id="overlayStat"></p>
      <button class="retry-btn" onclick="restartBattle()">다시하기</button>
    </div>
    <div class="kickit-intro" id="kickitIntro">
      <span class="ki-en">KICK IT</span>
      <span class="ki-kr">KICK IT!</span>
    </div>
  </div>
</div>

<!-- UNLOCK BANNER -->
<div id="unlock-banner">
  <span style="animation:pulse 1.2s steps(2) infinite;display:inline-block;line-height:0;">
    <svg viewBox="0 0 16 16" width="16" height="16" style="image-rendering:pixelated" xmlns="http://www.w3.org/2000/svg">
      <rect x="7" y="0" width="2" height="2" fill="#3a6010"/><rect x="8" y="1" width="3" height="1" fill="#2a4a08"/>
      <rect x="9" y="1" width="2" height="1" fill="#5aaa20"/><rect x="10" y="0" width="2" height="1" fill="#4a9010"/>
      <rect x="3" y="2" width="10" height="1" fill="#6ab830"/><rect x="2" y="3" width="12" height="1" fill="#7acc40"/>
      <rect x="1" y="4" width="14" height="1" fill="#88dd50"/><rect x="1" y="5" width="14" height="1" fill="#96ee5a"/>
      <rect x="1" y="6" width="14" height="1" fill="#a0f060"/><rect x="1" y="7" width="14" height="1" fill="#aaff66"/>
      <rect x="1" y="8" width="14" height="1" fill="#a0f060"/><rect x="1" y="9" width="14" height="1" fill="#96ee5a"/>
      <rect x="1" y="10" width="14" height="1" fill="#88dd50"/><rect x="2" y="11" width="12" height="1" fill="#7acc40"/>
      <rect x="3" y="12" width="10" height="1" fill="#6ab830"/><rect x="4" y="13" width="8" height="1" fill="#5aaa28"/>
      <rect x="5" y="14" width="6" height="1" fill="#4a9020"/>
      <rect x="3" y="4" width="3" height="2" fill="#ccffaa" opacity="0.7"/>
      <rect x="7" y="2" width="2" height="1" fill="#5aaa20"/>
    </svg>
  </span>
  <span style="font-size:8px;color:#1a1a1a;letter-spacing:0.1em;">TAP TO START</span>
  <span style="font-size:9px;color:#1a1a1a;opacity:0.85;margin-left:4px;">🔇 기기 무음모드를 해제하세요!</span>
</div>

<script>
/* ════════════ TRANSFORM ════════════ */
const app=document.getElementById('transform-screen');
const bgC=document.getElementById('bg-canvas'),pC=document.getElementById('pc');
const bgX=bgC.getContext('2d'),pX=pC.getContext('2d');
const befL=document.getElementById('bef-l'),befR=document.getElementById('bef-r');
const aftL=document.getElementById('aft-l'),aftR=document.getElementById('aft-r');
const pfill=document.getElementById('pfill'),plbl=document.getElementById('plbl');
const fov=document.getElementById('fov');
const bicon=document.getElementById('bicon'),bhint=document.getElementById('bhint');
const bhintTop=document.getElementById('bhint-top');
const goBtn=document.getElementById('go-btn'),tbtn=document.getElementById('tbtn');
let transformed=false,busy=false,stars=[],tParts=[],blockP=false,bgRaf=null;

document.addEventListener('mousemove',e=>{
  document.getElementById('cursor').style.left=e.clientX+'px';
  document.getElementById('cursor').style.top=e.clientY+'px';
});

function resize(){bgC.width=pC.width=app.offsetWidth;bgC.height=pC.height=app.offsetHeight;}
function initStars(){stars=[];for(let i=0;i<130;i++)stars.push({x:Math.random()*bgC.width,y:Math.random()*bgC.height,r:Math.random()*1.5+0.2,a:Math.random(),spd:Math.random()*0.007+0.002,gold:Math.random()<0.3});}

class Pt{
  constructor(x,y,type){
    this.x=x;this.y=y;const a=Math.random()*Math.PI*2,s=Math.random()*7+1;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-3.5;
    this.life=1;this.decay=Math.random()*0.013+0.008;this.sz=Math.random()*9+2;
    const P={
      gold:['#b4f040','#dcff90','#ccff66','#aaff44'],
      pink:['#88ffaa','#aaffcc','#66ffbb','#ddffee'],
      rainbow:['#44ff66','#88ff44','#ccff44','#44ccff','#44ffaa','#aaff44'],
      sparkle:['#ccffaa','#b4f040','#aaffcc','#eeffcc'],
      star:['#b4f040','#dcff90','#ccffaa']
    };
    const pal=P[type]||P.gold;this.col=pal[Math.floor(Math.random()*pal.length)];
    this.shape=Math.random()<0.3?'star':Math.random()<0.4?'heart':'circle';
    this.rot=Math.random()*Math.PI*2;this.rotS=(Math.random()-.5)*0.22;this.g=0.09;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=0.98;this.life-=this.decay;this.rot+=this.rotS;}
  draw(ctx){
    if(this.life<=0)return;ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.col;
    if(this.shape==='star')dStar(ctx,0,0,this.sz*0.4,this.sz,5);
    else if(this.shape==='heart')dHeart(ctx,0,0,this.sz*0.7);
    else{ctx.beginPath();ctx.arc(0,0,this.sz*0.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
function dStar(ctx,cx,cy,ir,or,pts){ctx.beginPath();for(let i=0;i<pts*2;i++){const a=(i*Math.PI)/pts-Math.PI/2,r=i%2===0?or:ir;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.fill();}
function dHeart(ctx,cx,cy,s){ctx.beginPath();ctx.moveTo(cx,cy+s*.3);ctx.bezierCurveTo(cx,cy-s*.3,cx-s,cy-s*.3,cx-s,cy);ctx.bezierCurveTo(cx-s,cy+s*.5,cx,cy+s*.8,cx,cy+s*.8);ctx.bezierCurveTo(cx,cy+s*.8,cx+s,cy+s*.5,cx+s,cy);ctx.bezierCurveTo(cx+s,cy-s*.3,cx,cy-s*.3,cx,cy+s*.3);ctx.fill();}

  e.preventDefault();
}
function joyMove(e){
  if(!joyActive)return;
  const t=e.touches?e.touches[0]:e;
  let dx=t.clientX-joyBaseX,dy=t.clientY-joyBaseY;
  const dist=Math.hypot(dx,dy);
  if(dist>JOY_MAX){dx=dx/dist*JOY_MAX;dy=dy/dist*JOY_MAX;}
  joyThumb.style.transform=`translate(${dx}px,${dy}px)`;
  joyDX=dx/JOY_MAX;joyDY=dy/JOY_MAX;
  e.preventDefault();
}
function joyEnd(e){
  joyActive=false;joyDX=0;joyDY=0;
  joyThumb.style.transform='translate(0,0)';
  if(e)e.preventDefault();
}
joyBase.addEventListener('touchstart',joyStart,{passive:false});
joyBase.addEventListener('touchmove',joyMove,{passive:false});
joyBase.addEventListener('touchend',joyEnd,{passive:false});
joyBase.addEventListener('touchcancel',joyEnd,{passive:false});

function applyBKeys(dt){
  const spd=170*dt;
  if(bKeys['ArrowLeft']||bKeys['a']||bKeys['A'])player.x-=spd;
  if(bKeys['ArrowRight']||bKeys['d']||bKeys['D'])player.x+=spd;
  if(bKeys['ArrowUp']||bKeys['w']||bKeys['W'])player.y-=spd;
  if(bKeys['ArrowDown']||bKeys['s']||bKeys['S'])player.y+=spd;
  if(joyDX||joyDY){player.x+=joyDX*spd;player.y+=joyDY*spd;}
  player.x=Math.min(Math.max(player.x,player.r+4),BW-player.r-4);
  player.y=Math.min(Math.max(player.y,player.r+4),BH-player.r-4);
}

/* ── bullet patterns ── */
/* HYUN: 활쏘기 — 박스를 가로질러 활처럼 호를 그리며 날아가는 화살 */
function spawnArrow(){
  playAttackFrames('hyun');
  const cfg=STAGE_CONFIG[getStage()];
  const dir=Math.random()<0.5?1:-1;
  const baseY=14+Math.random()*(BH-28);
  /* 호의 방향을 위/아래 랜덤으로 — 항상 위로만 휘면 바닥 구석이 영원히 안전지대가 됨.
     20% 확률로는 호 없이 그 줄을 그대로 직선으로 가로질러 구석도 직접 위협함. */
  const straight=Math.random()<0.2;
  const arcDir=Math.random()<0.5?1:-1;
  const peak=straight?0:(28+Math.random()*38)*cfg.sizeMul*arcDir;
  const dur=Math.max(0.42,1.25/cfg.speedMul);
  const r=5*cfg.sizeMul;
  bullets.push({
    kind:'arrow',
    x0:dir>0?-12:BW+12, y0:baseY,
    x1:dir>0?BW+12:-12, y1:Math.min(Math.max(baseY+(Math.random()-0.5)*BH*0.3,10),BH-10),
    peak,dur,t:0,r,rot:0,x:0,y:0
  });
}
/* DA-IN: 독 퍼뜨리기 — 불투명한 원이 폭발하듯 퍼짐 */
function spawnPoison(){
  playAttackFrames('dain');
  const cfg=STAGE_CONFIG[getStage()];
  const m=Math.max(10,16-getStage());
  const x=m+Math.random()*(BW-m*2),y=m+Math.random()*(BH-m*2);
  const maxR=(22+Math.random()*16)*cfg.sizeMul;
  bullets.push({kind:'poison',x,y,born:performance.now(),seedDur:0.32,coreDur:0.14,burstDur:0.5,maxR,fragsGenerated:false,frags:null});
}

function startTurn(who){
  turn=who;
  setAttacker(who);
  const stage=getStage();
  const announce=who!=='dain';
  if(announce){
    turnBanner.textContent=who==='dual'?'FINAL STAGE':'STAGE '+stage;
    turnBanner.classList.add('show');
    playPop();
  }
  phase='banner';phaseUntil=performance.now()+(announce?(who==='dual'?1100:850):280);
}

function nextPhase(now){
  if(phase==='banner'&&now>=phaseUntil){
    turnBanner.classList.remove('show');
    phase='attack';
    phaseUntil=now+(turn==='dual'?6500:(5000+Math.min(round*150,1800)));
    if(turn==='hyun'||turn==='dual')nextSpawnA=now;
    if(turn==='dain'||turn==='dual')nextSpawnP=now;
  } else if(phase==='attack'&&now>=phaseUntil){
    phase='pause';bullets=[];phaseUntil=now+500;
  } else if(phase==='pause'&&now>=phaseUntil){
    if(turn==='hyun'){startTurn('dain');}
    else if(turn==='dain'){
      round++;roundNumEl.textContent=getStage();
      startTurn(round>=6?'dual':'hyun');
    } else {
      finalLoops++;
      if(finalLoops>=FINAL_STAGE_LOOPS){gameClear();}
      else{round++;roundNumEl.textContent=getStage();startTurn('dual');}
    }
  }
}

function update(dt,now){
  if(phase==='attack'){
    const cfg=STAGE_CONFIG[getStage()];
    const arrowRate=Math.max(190,650/cfg.rateMul);
    const poisonRate=Math.max(260,820/cfg.rateMul);
    if((turn==='hyun'||turn==='dual')&&now>=nextSpawnA){spawnArrow();nextSpawnA=now+arrowRate;}
    if((turn==='dain'||turn==='dual')&&now>=nextSpawnP){spawnPoison();nextSpawnP=now+poisonRate;}
  }
  bullets.forEach(b=>{
    if(b.kind==='arrow'){
      b.t+=dt/b.dur;
      const tt=Math.min(b.t,1);
      b.x=b.x0+(b.x1-b.x0)*tt;
      b.y=Math.min(Math.max(b.y0+(b.y1-b.y0)*tt-b.peak*4*tt*(1-tt),6),BH-6);
      const dx=(b.x1-b.x0),dy=(b.y1-b.y0)-b.peak*4*(1-2*tt);
      b.rot=Math.atan2(dy,dx);
    } else if(b.kind==='poison'){
      const el=(now-b.born)/1000,coreEl=el-b.seedDur;
      if(coreEl>=b.coreDur&&!b.fragsGenerated){
        b.fragsGenerated=true;playSnap();
        const n=6+Math.floor(Math.random()*3)+Math.floor((getStage()-1)/2);
        b.frags=[];
        for(let i=0;i<n;i++){
          const a=(i/n)*Math.PI*2+(Math.random()-0.5)*0.5;
          const dist=b.maxR*(1.6+Math.random()*1.0);
          const speed=dist/b.burstDur;
          b.frags.push({vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r0:b.maxR*(0.22+Math.random()*0.18)});
        }
      }
    }
  });
  bullets=bullets.filter(b=>{
    if(b.kind==='arrow')return b.t<1.04;
    return (now-b.born)/1000<b.seedDur+b.coreDur+b.burstDur+0.05;
  });
  applyBKeys(dt);
  if(invuln>0)invuln-=dt;
  if(invuln<=0){
    for(const b of bullets){
      if(b.kind==='arrow'){
        const dx=b.x-player.x,dy=b.y-player.y;
        if(Math.sqrt(dx*dx+dy*dy)<b.r+player.r-2){onHit();break;}
      } else if(checkPoisonHit(b,now)){onHit();break;}
    }
  }
  nextPhase(now);
}

function checkPoisonHit(b,now){
  const el=(now-b.born)/1000;
  if(el<b.seedDur)return false;
  const coreEl=el-b.seedDur;
  if(coreEl<b.coreDur){
    const cf=Math.min(coreEl/b.coreDur,1);
    const r=b.maxR*(1-Math.pow(1-cf,3));
    const dx=b.x-player.x,dy=b.y-player.y;
    return Math.sqrt(dx*dx+dy*dy)<r+player.r*0.3;
  }
  if(!b.frags)return false;
  const bt=coreEl-b.coreDur,bf=Math.min(bt/b.burstDur,1);
  for(const f of b.frags){
    const fr=f.r0*(1-bf);
    if(fr<=0.5)continue;
    const fx=b.x+f.vx*bt,fy=b.y+f.vy*bt;
    const dx=fx-player.x,dy=fy-player.y;
    if(Math.sqrt(dx*dx+dy*dy)<fr+player.r*0.5)return true;
  }
  return false;
}

function onHit(){
  hp--;invuln=1.1;renderHp();playSnap();
  if(hp<=0)gameOver();
}

/* 마우스 커서와 완전히 같은 픽셀 사과 — 그 16x16 rect 데이터를 그대로 재사용 */
const APPLE_PIXELS=[
  [7,0,2,1,'#3a6010'],[8,1,3,1,'#2a4a08'],[9,1,2,1,'#5aaa20'],[10,0,2,1,'#4a9010'],
  [3,2,10,1,'#6ab830'],[2,3,12,1,'#7acc40'],
  [1,4,14,1,'#88dd50'],[1,5,14,1,'#96ee5a'],[1,6,14,1,'#a0f060'],[1,7,14,1,'#aaff66'],
  [1,8,14,1,'#a0f060'],[1,9,14,1,'#96ee5a'],[1,10,14,1,'#88dd50'],
  [2,11,12,1,'#7acc40'],[3,12,10,1,'#6ab830'],[4,13,8,1,'#5aaa28'],[5,14,6,1,'#4a9020'],
  [3,4,3,2,'#ccffaa',0.7],[7,2,2,1,'#5aaa20']
];
function hexToRedVariant(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const t=((r+g+b)/3)/255;
  return `rgb(${Math.round(110+135*t)},${Math.round(16+26*t)},${Math.round(16+26*t)})`;
}
const APPLE_PIXELS_RED=APPLE_PIXELS.map(p=>[p[0],p[1],p[2],p[3],hexToRedVariant(p[4]),p[5]]);

function drawPixelApple(ctx,cx,cy,r,useRed){
  const pal=useRed?APPLE_PIXELS_RED:APPLE_PIXELS;
  const scale=r/7,ox=8,oy=8;
  ctx.save();
  pal.forEach(p=>{
    ctx.globalAlpha=p[5]!==undefined?p[5]:1;
    ctx.fillStyle=p[4];
    ctx.fillRect(cx+(p[0]-ox)*scale,cy+(p[1]-oy)*scale,p[2]*scale,p[3]*scale);
  });
  ctx.restore();
}
function drawApple(ctx,x,y,r,flash){
  if(!flash){
    ctx.save();
    ctx.shadowColor='rgba(224,255,176,0.95)';
    ctx.shadowBlur=16;
    drawPixelApple(ctx,x,y,r,false);
    ctx.restore();
    return;
  }
  /* 피격 글리치 — 빨갛게 깜빡이며 흔들리고, 디지털 슬라이스 바가 튐 */
  const jx=(Math.random()-0.5)*3,jy=(Math.random()-0.5)*3;
  const blink=Math.floor(performance.now()/45)%2===0;
  ctx.save();ctx.globalAlpha=blink?1:0.4;
  drawPixelApple(ctx,x+jx,y+jy,r,true);
  ctx.restore();
  ctx.save();ctx.globalAlpha=0.85;
  for(let i=0;i<2;i++){
    const sy=y+(Math.random()-0.5)*r*1.7,sh=1.5+Math.random()*2.5,sx=x+(Math.random()-0.5)*4;
    ctx.fillStyle=Math.random()<0.5?'#ffffff':'#ff2d3d';
    ctx.fillRect(sx-r,sy,r*2,sh);
  }
  ctx.restore();
}
function drawBullet(b,now){
  if(b.kind==='arrow'){
    bctx.save();bctx.translate(b.x,b.y);bctx.rotate(b.rot);bctx.fillStyle='#b4f040';
    bctx.beginPath();bctx.moveTo(b.r*1.8,0);bctx.lineTo(-b.r*1.1,b.r*0.8);bctx.lineTo(-b.r*0.5,0);bctx.lineTo(-b.r*1.1,-b.r*0.8);bctx.closePath();bctx.fill();
    bctx.restore();
  } else {
    const el=(now-b.born)/1000;
    bctx.save();bctx.translate(b.x,b.y);
    if(el<b.seedDur){
      bctx.globalAlpha=0.6+0.4*Math.sin(now/55);
      bctx.fillStyle='#b4f040';bctx.beginPath();bctx.arc(0,0,4,0,Math.PI*2);bctx.fill();
    } else {
      const coreEl=el-b.seedDur;
      if(coreEl<b.coreDur){
        /* 큰 불투명 원으로 빠르게 부풀어 오름 */
        const cf=Math.min(coreEl/b.coreDur,1);
        const r=b.maxR*(1-Math.pow(1-cf,3));
        bctx.globalAlpha=1;bctx.fillStyle='#b4f040';
        bctx.beginPath();bctx.arc(0,0,r,0,Math.PI*2);bctx.fill();
      } else if(b.frags){
        const bt=coreEl-b.coreDur,bf=Math.min(bt/b.burstDur,1);
        /* 터지는 순간 플래시 */
        const flashAlpha=Math.max(0,1-bf*5);
        if(flashAlpha>0){
          bctx.globalAlpha=flashAlpha;bctx.fillStyle='#f4ffc8';
          bctx.beginPath();bctx.arc(0,0,b.maxR*0.5,0,Math.PI*2);bctx.fill();
        }
        /* 작은 원들로 쪼개져 흩어짐 */
        b.frags.forEach(f=>{
          const fr=f.r0*(1-bf);
          if(fr<=0.4)return;
          const fx=f.vx*bt,fy=f.vy*bt;
          bctx.globalAlpha=bf<0.6?1:Math.max(0,1-(bf-0.6)/0.4);
          bctx.fillStyle='#b4f040';
          bctx.beginPath();bctx.arc(fx,fy,fr,0,Math.PI*2);bctx.fill();
        });
      }
    }
    bctx.restore();
  }
}

function draw(){
  const now=performance.now();
  bctx.clearRect(0,0,BW,BH);
  bctx.fillStyle='#0a140a';bctx.fillRect(0,0,BW,BH);
  bullets.forEach(b=>drawBullet(b,now));
  drawApple(bctx,player.x,player.y,player.r,invuln>0);
}

function battleLoop(now){
  if(!battleRunning)return;
  const dt=Math.min((now-(battleLoop.last||now))/1000,0.05);battleLoop.last=now;
  elapsed+=dt;timeNumEl.textContent=Math.floor(elapsed);
  update(dt,now);
  draw();
  battleRaf=requestAnimationFrame(battleLoop);
}

const overlayTitle=document.getElementById('overlayTitle');

function gameOver(){
  battleRunning=false;cancelAnimationFrame(battleRaf);
  overlayTitle.textContent='GAME OVER';overlayTitle.style.color='';
  overlayStat.textContent=`STAGE ${getStage()} · ${Math.floor(elapsed)}초 생존`;
  battleOverlay.classList.add('show');
}
function gameClear(){
  battleRunning=false;cancelAnimationFrame(battleRaf);
  overlayTitle.textContent='CLEAR!';overlayTitle.style.color='#ffe066';
  overlayStat.textContent=`FINAL STAGE 통과! · ${Math.floor(elapsed)}초 생존`;
  battleOverlay.classList.add('show');
  fadeBgTo(0,1200);
}
function restartBattle(){
  battleOverlay.classList.remove('show');
  hp=maxHp;round=1;elapsed=0;bullets=[];invuln=0;finalLoops=0;
  roundNumEl.textContent=1;timeNumEl.textContent=0;renderHp();
  player.x=BW/2;player.y=BH/2;
  battleRunning=true;battleLoop.last=performance.now();
  playBgMusic();
  startTurn('hyun');
  battleRaf=requestAnimationFrame(battleLoop);
}

/* ════════════ BATTLE START/STOP ════════════ */
function startBattle(){
  const intro=document.getElementById('kickitIntro');
  intro.classList.remove('show');void intro.offsetWidth;intro.classList.add('show');
  const banner=document.getElementById('unlock-banner');
  banner.style.display='flex';
  setTimeout(()=>{banner.style.top='0';},50);
  banner.onclick=function(){
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const hide=()=>{banner.style.top='-56px';setTimeout(()=>banner.style.display='none',400);};
    if(AC.state==='suspended')AC.resume().then(hide);else hide();
    playBgMusic();
    banner.onclick=null;
  };
  fitCanvas();
  battleCanvas.addEventListener('pointermove',onBattlePointer);
  battleCanvas.addEventListener('pointerdown',onBattlePointer);
  window.addEventListener('keydown',onBKeyDown);
  window.addEventListener('keyup',onBKeyUp);
  window.addEventListener('resize',fitCanvas);
  hp=maxHp;round=1;elapsed=0;bullets=[];invuln=0;finalLoops=0;
  roundNumEl.textContent=1;timeNumEl.textContent=0;renderHp();
  battleOverlay.classList.remove('show');
  playBgMusic();
  setTimeout(()=>{
    fitCanvas();
    player.x=BW/2;player.y=BH/2;
    battleRunning=true;battleLoop.last=performance.now();
    startTurn('hyun');
    battleRaf=requestAnimationFrame(battleLoop);
  },1300);
}
function stopBattle(){
  battleRunning=false;cancelAnimationFrame(battleRaf);
  stopBgMusic();
  battleCanvas.removeEventListener('pointermove',onBattlePointer);
  battleCanvas.removeEventListener('pointerdown',onBattlePointer);
  window.removeEventListener('keydown',onBKeyDown);
  window.removeEventListener('keyup',onBKeyUp);
  window.removeEventListener('resize',fitCanvas);
  bullets=[];bKeys={};joyEnd();
  turnBanner.classList.remove('show');
  const banner=document.getElementById('unlock-banner');
  banner.style.top='-56px';setTimeout(()=>banner.style.display='none',400);
}
</script>
