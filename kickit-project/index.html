<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍏 Green Apple ASMR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  min-height: 100dvh;
  overflow: hidden;
  user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
}
.container {
  display: flex;
  width: 100vw;
  height: 100dvh;
  flex-direction: column;
}
@media (orientation: landscape) {
  .container { flex-direction: row; }
  .zone { border-right: 4px solid #1a1a1a; border-bottom: none !important; }
  .zone:last-child { border-right: none; }
}
.zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  border-bottom: 4px solid #1a1a1a;
}
.zone:last-child { border-bottom: none; }
#z1 { background: #b8d870; }
#z2 { background: #c8e878; }
#z3 { background: #d8f080; }

/* pixel grid overlay */
.pixel-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0.08;
  background-image:
    linear-gradient(#1a1a1a 1px, transparent 1px),
    linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
  background-size: 8px 8px;
}

/* falling apples */
.apple {
  position: absolute;
  cursor: pointer;
  pointer-events: auto;
  transform-origin: center top;
  animation: fall linear forwards;
  image-rendering: pixelated;
}
@keyframes fall { 0%{top:-70px;opacity:1;} 100%{top:110%;opacity:1;} }
.apple-svg { width: 100%; height: 100%; overflow: visible; image-rendering: pixelated; }

/* burst */
.burst-piece {
  position: absolute;
  pointer-events: none;
  image-rendering: pixelated;
  animation: burst-fly 0.4s steps(4) forwards;
}
@keyframes burst-fly {
  0%{opacity:1;transform:translate(0,0);}
  100%{opacity:0;transform:translate(var(--bx),var(--by));}
}

/* squishy */
#sq { overflow: visible; cursor: grab; touch-action: none; image-rendering: pixelated; }
#sq:active { cursor: grabbing; }

/* pixel keycaps */
.kb-base {
  background: #a0a8b0;
  padding: 12px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  border: 4px solid #1a1a1a;
  box-shadow: 6px 6px 0 #1a1a1a;
  image-rendering: pixelated;
}
.kb-row { display: flex; gap: 8px; align-items: flex-end; }
.key-wrap { display: flex; flex-direction: column; align-items: center; }
.key-side {
  width: 52px; height: 6px;
  background: #606870;
  border: 2px solid #1a1a1a;
  border-top: none;
  transition: height 0.05s;
}
.key {
  width: 52px; height: 48px;
  background: #e8f0d8;
  cursor: pointer;
  position: relative;
  border: 3px solid #1a1a1a;
  box-shadow: 3px 3px 0 #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: #2a3a1a;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  image-rendering: pixelated;
  transition: transform 0.05s, box-shadow 0.05s;
}
.key.down {
  transform: translate(3px, 3px);
  box-shadow: 0 0 0 #1a1a1a;
}
.key.down + .key-side { height: 2px; }
.key-space { width: 168px !important; }
.key-space-side { width: 168px !important; }

/* pixel particles */
.pp {
  position: absolute;
  width: 6px; height: 6px;
  pointer-events: none;
  image-rendering: pixelated;
  animation: pa 0.4s steps(4) forwards;
}
@keyframes pa {
  0%{opacity:1;transform:translate(0,0);}
  100%{opacity:0;transform:translate(var(--tx),var(--ty));}
}

/* unlock banner */
#unlock-banner {
  position: fixed; top: -56px; left: 0; right: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #7dc940;
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: top 0.35s steps(6);
  font-family: 'Press Start 2P', monospace;
}
</style>
</head>
<body>
<div class="container">

  <!-- ZONE 1: FALLING APPLES -->
  <div class="zone" id="z1">
    <div class="pixel-overlay"></div>
  </div>

  <!-- ZONE 2: SQUISHY -->
  <div class="zone" id="z2">
    <div class="pixel-overlay"></div>
    <svg id="sq" viewBox="0 0 220 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="htBody" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="4" height="4" fill="#3a8000" opacity="0.4"/>
        </pattern>
      </defs>
      <ellipse id="shad" cx="110" cy="214" rx="52" ry="8" fill="#1a1a1a" opacity="0.2"/>
      <path id="body" fill="#7dc940" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
      <path id="bodyHT" fill="url(#htBody)" opacity="0.5"/>
      <path id="inner" fill="#a0e060" opacity="0.4"/>
      <!-- pixel highlight squares -->
      <rect id="spec1" x="80" y="72" width="8" height="8" fill="white" opacity="0.7"/>
      <rect id="spec2" x="88" y="64" width="6" height="6" fill="white" opacity="0.5"/>
      <path id="leafPath" d="M110,52 C100,30 70,18 65,28 C60,38 88,46 110,52 Z" fill="#2e7d1a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <path id="leafVein" d="M110,52 C92,42 74,28 65,28" stroke="#1a5010" stroke-width="2" fill="none"/>
      <path id="stemP" d="M110,52 Q112,38 110,28" stroke="#3d6e18" stroke-width="5" fill="none" stroke-linecap="square"/>
    </svg>
  </div>

  <!-- ZONE 3: KEYCAPS -->
  <div class="zone" id="z3">
    <div class="pixel-overlay"></div>
    <div class="kb-base" id="kbBase"></div>
  </div>

</div>

<!-- UNLOCK BANNER -->
<div id="unlock-banner">
  <span style="font-size:14px;animation:pulse 1.2s steps(2) infinite;display:inline-block;">🍏</span>
  <span style="font-size:8px;color:#1a1a1a;letter-spacing:0.1em;">TAP TO START</span>
  <span style="font-size:9px;color:#1a1a1a;opacity:0.85;margin-left:4px;">🔇 기기 무음모드를 해제하세요!</span>
</div>
<style>@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}</style>

<script>
// ── Audio ──
let AC = null;
function getAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }
function resume(){ const ac=getAC(); if(ac.state==='suspended') ac.resume(); }

function playPop(){
  resume(); const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const atkLen=Math.floor(sr*0.012),atkBuf=ac.createBuffer(1,atkLen,sr),ad=atkBuf.getChannelData(0);
  for(let i=0;i<atkLen;i++) ad[i]=(Math.random()*2-1)*Math.pow(1-i/atkLen,1.8);
  const atkSrc=ac.createBufferSource(); atkSrc.buffer=atkBuf;
  const bp1=ac.createBiquadFilter(); bp1.type='bandpass'; bp1.frequency.value=900; bp1.Q.value=1.0;
  const ag=ac.createGain(); atkSrc.connect(bp1); bp1.connect(ag); ag.connect(ac.destination);
  ag.gain.setValueAtTime(2.5,t); ag.gain.exponentialRampToValueAtTime(0.001,t+0.012);
  atkSrc.start(t); atkSrc.stop(t+0.015);
  const o=ac.createOscillator(),og=ac.createGain(); o.connect(og); og.connect(ac.destination); o.type='sine';
  o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(120,t+0.12);
  og.gain.setValueAtTime(0.7,t+0.002); og.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.start(t); o.stop(t+0.15);
  const spLen=Math.floor(sr*0.03),spBuf=ac.createBuffer(1,spLen,sr),sd=spBuf.getChannelData(0);
  for(let i=0;i<spLen;i++) sd[i]=(Math.random()*2-1)*Math.exp(-i/(spLen*0.15));
  const spSrc=ac.createBufferSource(); spSrc.buffer=spBuf;
  const shp=ac.createBiquadFilter(); shp.type='highpass'; shp.frequency.value=3000;
  const sg=ac.createGain(); spSrc.connect(shp); shp.connect(sg); sg.connect(ac.destination);
  sg.gain.setValueAtTime(0.8,t+0.008); sg.gain.exponentialRampToValueAtTime(0.001,t+0.035);
  spSrc.start(t+0.008); spSrc.stop(t+0.04);
}
function playStretch(mag){
  resume(); const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const len=Math.floor(sr*0.08),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.45));
  const src=ac.createBufferSource(); src.buffer=buf;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=Math.min(180+mag*2.5,600); bp.Q.value=2.2;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
  const g=ac.createGain(); src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(Math.min(0.32,0.1+mag*0.002),t); g.gain.exponentialRampToValueAtTime(0.001,t+0.075);
  src.start(t); src.stop(t+0.08);
  const o=ac.createOscillator(),og=ac.createGain(); o.connect(og); og.connect(ac.destination); o.type='sine';
  const baseF=80+mag*0.8;
  o.frequency.setValueAtTime(baseF,t); o.frequency.linearRampToValueAtTime(baseF*1.4,t+0.07);
  og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(Math.min(0.14,0.04+mag*0.001),t+0.02);
  og.gain.exponentialRampToValueAtTime(0.001,t+0.08); o.start(t); o.stop(t+0.08);
}
function playSnap(){
  resume(); const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const atkLen=Math.floor(sr*0.018),atkBuf=ac.createBuffer(1,atkLen,sr),ad=atkBuf.getChannelData(0);
  for(let i=0;i<atkLen;i++) ad[i]=(Math.random()*2-1)*Math.pow(1-i/atkLen,1.2);
  const atkSrc=ac.createBufferSource(); atkSrc.buffer=atkBuf;
  const abp=ac.createBiquadFilter(); abp.type='bandpass'; abp.frequency.value=420; abp.Q.value=1.8;
  const alp=ac.createBiquadFilter(); alp.type='lowpass'; alp.frequency.value=1000;
  const ag=ac.createGain(); atkSrc.connect(abp); abp.connect(alp); alp.connect(ag); ag.connect(ac.destination);
  ag.gain.setValueAtTime(0.75,t); ag.gain.exponentialRampToValueAtTime(0.001,t+0.018);
  atkSrc.start(t); atkSrc.stop(t+0.02);
  const o1=ac.createOscillator(),g1=ac.createGain(); o1.connect(g1); g1.connect(ac.destination); o1.type='sine';
  o1.frequency.setValueAtTime(55,t); o1.frequency.linearRampToValueAtTime(130,t+0.05); o1.frequency.exponentialRampToValueAtTime(65,t+0.22);
  g1.gain.setValueAtTime(0,t); g1.gain.linearRampToValueAtTime(0.45,t+0.012); g1.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o1.start(t); o1.stop(t+0.26);
  const thLen=Math.floor(sr*0.06),thBuf=ac.createBuffer(1,thLen,sr),thd=thBuf.getChannelData(0);
  for(let i=0;i<thLen;i++) thd[i]=(Math.random()*2-1)*Math.exp(-i/(thLen*0.14));
  const thSrc=ac.createBufferSource(); thSrc.buffer=thBuf;
  const tlp=ac.createBiquadFilter(); tlp.type='lowpass'; tlp.frequency.value=200;
  const tg=ac.createGain(); thSrc.connect(tlp); tlp.connect(tg); tg.connect(ac.destination);
  tg.gain.setValueAtTime(0.38,t); tg.gain.exponentialRampToValueAtTime(0.001,t+0.06);
  thSrc.start(t); thSrc.stop(t+0.065);
}
function playClick(){
  resume(); const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const atkLen=Math.floor(sr*0.003),atkBuf=ac.createBuffer(1,atkLen,sr),ad=atkBuf.getChannelData(0);
  for(let i=0;i<atkLen;i++) ad[i]=(Math.random()*2-1)*Math.pow(1-i/atkLen,3.0);
  const atkSrc=ac.createBufferSource(); atkSrc.buffer=atkBuf;
  const aHP=ac.createBiquadFilter(); aHP.type='highpass'; aHP.frequency.value=4000;
  const aBP=ac.createBiquadFilter(); aBP.type='bandpass'; aBP.frequency.value=5500; aBP.Q.value=0.8;
  const ag=ac.createGain(); atkSrc.connect(aHP); aHP.connect(aBP); aBP.connect(ag); ag.connect(ac.destination);
  ag.gain.setValueAtTime(4.0,t); ag.gain.exponentialRampToValueAtTime(0.001,t+0.003);
  atkSrc.start(t); atkSrc.stop(t+0.005);
  const resLen=Math.floor(sr*0.025),resBuf=ac.createBuffer(1,resLen,sr),rd=resBuf.getChannelData(0);
  for(let i=0;i<resLen;i++) rd[i]=(Math.random()*2-1)*Math.exp(-i/(resLen*0.14));
  const resSrc=ac.createBufferSource(); resSrc.buffer=resBuf;
  const rBP=ac.createBiquadFilter(); rBP.type='bandpass'; rBP.frequency.value=2200; rBP.Q.value=3.0;
  const rLP=ac.createBiquadFilter(); rLP.type='lowpass'; rLP.frequency.value=3000;
  const rg=ac.createGain(); resSrc.connect(rBP); rBP.connect(rLP); rLP.connect(rg); rg.connect(ac.destination);
  rg.gain.setValueAtTime(2.5,t+0.001); rg.gain.exponentialRampToValueAtTime(0.001,t+0.025);
  resSrc.start(t+0.001); resSrc.stop(t+0.028);
  const thLen=Math.floor(sr*0.015),thBuf=ac.createBuffer(1,thLen,sr),thd=thBuf.getChannelData(0);
  for(let i=0;i<thLen;i++) thd[i]=(Math.random()*2-1)*Math.exp(-i/(thLen*0.1));
  const thSrc=ac.createBufferSource(); thSrc.buffer=thBuf;
  const tLP=ac.createBiquadFilter(); tLP.type='lowpass'; tLP.frequency.value=500;
  const tg2=ac.createGain(); thSrc.connect(tLP); tLP.connect(tg2); tg2.connect(ac.destination);
  tg2.gain.setValueAtTime(1.8,t); tg2.gain.exponentialRampToValueAtTime(0.001,t+0.015);
  thSrc.start(t); thSrc.stop(t+0.018);
}

// ── Pixel Particles ──
function spawnPP(cx, cy, zone, color, count=8){
  const rect=zone.getBoundingClientRect();
  for(let i=0;i<count;i++){
    const p=document.createElement('div'); p.className='pp';
    p.style.background=color; p.style.borderRadius='0';
    p.style.left=(cx-rect.left-3)+'px'; p.style.top=(cy-rect.top-3)+'px';
    const a=(i/count)*Math.PI*2, r=20+Math.random()*24;
    p.style.setProperty('--tx', Math.cos(a)*r+'px');
    p.style.setProperty('--ty', Math.sin(a)*r+'px');
    zone.appendChild(p); setTimeout(()=>p.remove(), 420);
  }
}

// ── ZONE 1: FALLING PIXEL APPLES ──
let appleId=0, appleTimer=null;

function makePixelAppleSVG(){
  appleId++;
  // 픽셀 도트 사과 — 16x16 grid scaled up
  return `<svg class="apple-svg" viewBox="0 0 16 18" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated">
    <!-- stem -->
    <rect x="7" y="0" width="2" height="2" fill="#3a6010"/>
    <!-- leaf -->
    <rect x="9" y="0" width="3" height="1" fill="#5aaa20"/>
    <rect x="9" y="1" width="2" height="1" fill="#5aaa20"/>
    <!-- apple body -->
    <rect x="3" y="2" width="10" height="1" fill="#5aaa20"/>
    <rect x="2" y="3" width="12" height="1" fill="#6abb28"/>
    <rect x="1" y="4" width="14" height="1" fill="#7dc940"/>
    <rect x="1" y="5" width="14" height="1" fill="#88dd48"/>
    <rect x="1" y="6" width="14" height="1" fill="#90e850"/>
    <rect x="1" y="7" width="14" height="1" fill="#98f058"/>
    <rect x="1" y="8" width="14" height="1" fill="#90e850"/>
    <rect x="1" y="9" width="14" height="1" fill="#88dd48"/>
    <rect x="1" y="10" width="14" height="1" fill="#7dc940"/>
    <rect x="1" y="11" width="14" height="1" fill="#6abb28"/>
    <rect x="2" y="12" width="12" height="1" fill="#5aaa20"/>
    <rect x="3" y="13" width="10" height="1" fill="#4a9018"/>
    <rect x="5" y="14" width="6" height="1" fill="#3a7010"/>
    <!-- highlight -->
    <rect x="3" y="4" width="3" height="2" fill="#ccffaa" opacity="0.8"/>
    <rect x="3" y="6" width="1" height="1" fill="#ccffaa" opacity="0.5"/>
    <!-- indent -->
    <rect x="7" y="2" width="2" height="1" fill="#4a9018"/>
    <!-- outline -->
    <rect x="3" y="2" width="10" height="1" fill="#1a1a1a" opacity="0.3"/>
    <rect x="1" y="4" width="1" height="8" fill="#1a1a1a" opacity="0.3"/>
    <rect x="14" y="4" width="1" height="8" fill="#1a1a1a" opacity="0.3"/>
    <rect x="3" y="13" width="10" height="1" fill="#1a1a1a" opacity="0.3"/>
  </svg>`;
}

function spawnBurstPieces(cx, cy, zone){
  const colors=['#7dc940','#a0e060','#5a9a20','#c8f080','#3a6010','#1a1a1a'];
  for(let i=0;i<10;i++){
    const p=document.createElement('div'); p.className='burst-piece';
    const s=(Math.random()<0.5?6:8)+'px';
    p.style.width=s; p.style.height=s;
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.borderRadius='0';
    p.style.left=(cx-4)+'px'; p.style.top=(cy-4)+'px'; p.style.zIndex=10;
    const a=Math.random()*Math.PI*2, r=24+Math.random()*40;
    p.style.setProperty('--bx', Math.cos(a)*r+'px');
    p.style.setProperty('--by', Math.sin(a)*r+'px');
    zone.appendChild(p); setTimeout(()=>p.remove(), 420);
  }
}

function spawnApple(){
  const z1=document.getElementById('az1')||document.getElementById('z1');
  if(!z1) return;
  const el=document.createElement('div'); el.className='apple';
  const zw=z1.clientWidth;
  const size=Math.floor((44+Math.random()*20)/8)*8; // snap to 8px grid
  el.style.width=size+'px'; el.style.height=size+'px';
  el.style.left=(Math.floor((10+Math.random()*(zw-size-20))/8)*8)+'px';
  const dur=2.2+Math.random()*2.5;
  el.style.animationDuration=dur+'s';
  el.style.transform=`rotate(${Math.floor((Math.random()-0.5)*4)*90*0.1}deg)`;
  el.innerHTML=makePixelAppleSVG();
  z1.appendChild(el);
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation(); if(el.dataset.popped) return; el.dataset.popped='1';
    playPop();
    const er=el.getBoundingClientRect(), zr=z1.getBoundingClientRect();
    spawnBurstPieces(er.left+er.width/2-zr.left, er.top+er.height/2-zr.top, z1);
    el.style.opacity='0'; el.style.transition='opacity 0.1s steps(2)';
    setTimeout(()=>el.remove(), 150);
  });
  setTimeout(()=>{if(el.parentNode)el.remove();},(dur+0.5)*1000);
}

// ── ZONE 2: PIXEL SQUISHY ──
const z2=document.getElementById('az2')||document.getElementById('z2');
const sqEl=document.getElementById('sq');
function setSqSize(){
  if(!z2||!sqEl) return;
  const s=Math.min(z2.clientWidth,z2.clientHeight)*0.82;
  sqEl.setAttribute('width',s); sqEl.setAttribute('height',s);
}
setSqSize(); window.addEventListener('resize',setSqSize);

const CX=110,CY=115,R=68;
let drag=null,sX=0,sY=0,vX=0,vY=0,raf2,lastSnd=0;

function blobPath(dx,dy,cx,cy,r){
  const mag=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx),pull=Math.min(mag,80);
  const stretch=1+pull/85,squeeze=1/Math.sqrt(stretch),N=32,pts=[];
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2;
    // 사과 실루엣: 위쪽 좌우 볼록, 상단 중앙 홈, 아래쪽 뾰족
    const topDent = Math.exp(-Math.pow((a - Math.PI*1.5)*4,2)) * 0.22; // 하단 중앙 홈 (뒤집기)
    const bottomPoint = Math.exp(-Math.pow((a - Math.PI/2)*3,2)) * 0.08; // 상단 살짝 뾰족
    const shoulderBulge = Math.exp(-Math.pow((Math.abs(a - Math.PI*1.5)-0.9)*3,2)) * 0.1; // 하단 어깨 볼록
    const appleR = r * (1 - topDent + shoulderBulge - bottomPoint);
    const ux=Math.cos(a),uy=Math.sin(a);
    const along=ux*Math.cos(ang)+uy*Math.sin(ang),perp=-ux*Math.sin(ang)+uy*Math.cos(ang);
    const ef=along>0?stretch:(1+(stretch-1)*0.08);
    const px=cx+(along*ef*Math.cos(ang)-perp*squeeze*Math.sin(ang))*appleR;
    const py=cy+(along*ef*Math.sin(ang)+perp*squeeze*Math.cos(ang))*appleR;
    pts.push({x:Math.round(px/2)*2, y:Math.round(py/2)*2});
  }
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=0;i<N;i++){
    const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)},${c2x.toFixed(1)} ${c2y.toFixed(1)},${p2.x} ${p2.y}`;
  }
  return d+'Z';
}

function drawBlob(dx,dy){
  const bp=blobPath(dx,dy,CX,CY,R);
  document.getElementById('body').setAttribute('d',bp);
  document.getElementById('bodyHT').setAttribute('d',bp);
  document.getElementById('inner').setAttribute('d',blobPath(dx,dy,CX,CY,R*0.52));
  const mag=Math.min(Math.sqrt(dx*dx+dy*dy),80);
  document.getElementById('shad').setAttribute('rx',(50+mag*0.1).toFixed(0));
  document.getElementById('shad').setAttribute('ry',Math.max(2,9-mag*0.07).toFixed(0));
  // pixel highlights
  const sx=Math.round((88-dx*0.06)/2)*2, sy=Math.round((72-dy*0.06)/2)*2;
  document.getElementById('spec1').setAttribute('x',sx-4);
  document.getElementById('spec1').setAttribute('y',sy);
  document.getElementById('spec2').setAttribute('x',sx+4);
  document.getElementById('spec2').setAttribute('y',sy-8);
  const tx=Math.round((CX+dx*0.03)/2)*2, ty=Math.round((CY-R+dy*0.03-2)/2)*2;
  document.getElementById('stemP').setAttribute('d',`M${tx},${ty} L${tx+2},${ty-14} L${tx},${ty-22}`);
  const lrot=(Math.atan2(dy,dx)*(180/Math.PI)*0.15).toFixed(1);
  document.getElementById('leafPath').setAttribute('transform',`translate(${tx-110},${ty-52}) rotate(${lrot},110,52)`);
  document.getElementById('leafVein').setAttribute('transform',`translate(${tx-110},${ty-52}) rotate(${lrot},110,52)`);
}
drawBlob(0,0);

sqEl.addEventListener('pointerdown',e=>{
  e.preventDefault(); sqEl.setPointerCapture(e.pointerId);
  drag={x0:e.clientX,y0:e.clientY}; cancelAnimationFrame(raf2);
});
sqEl.addEventListener('pointermove',e=>{
  if(!drag) return;
  sX=(e.clientX-drag.x0)*1.3; sY=(e.clientY-drag.y0)*1.3; drawBlob(sX,sY);
  const now=Date.now(),mag=Math.sqrt(sX*sX+sY*sY);
  if(mag>10&&now-lastSnd>90){playStretch(mag);lastSnd=now;}
});
sqEl.addEventListener('pointerup',e=>{
  if(!drag) return; drag=null;
  if(Math.sqrt(sX*sX+sY*sY)>8) playSnap();
  vX=-sX*0.3; vY=-sY*0.3; springLoop();
});
function springLoop(){
  vX+=-0.15*sX; vY+=-0.15*sY; vX*=0.70; vY*=0.70; sX+=vX; sY+=vY; drawBlob(sX,sY);
  if(Math.sqrt(sX*sX+sY*sY)>0.5||Math.sqrt(vX*vX+vY*vY)>0.1) raf2=requestAnimationFrame(springLoop);
  else{sX=0;sY=0;drawBlob(0,0);}
}

const z3=document.getElementById('az3')||document.getElementById('z3');
const kb=document.getElementById('kbBase');

const appleLogo=`<svg width="14" height="16" viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg" fill="#2a3a1a" style="image-rendering:pixelated"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.3 269-317.3 70.1 0 128.4 46.4 172.5 46.4 42.8 0 109.6-49 192.5-49 31 0 108.2 2.6 168.6 80.6zm-98.2-109.3c31.7-37.5 54.3-89.7 54.3-141.9 0-7.1-.6-14.3-1.9-20.1-51.6 1.9-112.3 34.4-149.2 75.8-28.5 32.4-55.1 84.7-55.1 137.6 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 46.4 0 102.9-31.1 136.4-70.8z"/></svg>`;

const topRow=document.createElement('div'); topRow.className='kb-row';
const botRow=document.createElement('div'); botRow.className='kb-row';
kb.appendChild(topRow); kb.appendChild(botRow);

[{label:'⌘',row:topRow},{label:'⌥',row:topRow},{label:'↵',row:topRow},{label:'space',row:botRow}].forEach(def=>{
  const kw=document.createElement('div'); kw.className='key-wrap';
  const k=document.createElement('div'); k.className='key';
  const side=document.createElement('div'); side.className='key-side';
  if(def.label==='space'){
    k.classList.add('key-space'); side.classList.add('key-space-side');
    k.innerHTML=`<span style="pointer-events:none">${appleLogo}</span>`;
  } else {
    k.textContent=def.label;
  }
  kw.appendChild(k); kw.appendChild(side); def.row.appendChild(kw);
  let kt=null;
  k.addEventListener('pointerdown',e=>{
    e.preventDefault(); playClick();
    k.classList.add('down'); side.style.height='2px';
    clearTimeout(kt); kt=setTimeout(()=>{k.classList.remove('down');side.style.height='6px';},100);
    spawnPP(e.clientX,e.clientY,z3,'#4a9018',6);
  });
});

// ── UNLOCK BANNER ──
(function(){
  const banner=document.getElementById('unlock-banner');
  setTimeout(()=>{ banner.style.top='0'; }, 100);
  function unlock(){
    if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
    const hide=()=>{
      banner.style.top='-56px';
      setTimeout(()=>banner.style.display='none', 400);
    };
    if(AC.state==='suspended') AC.resume().then(hide); else hide();
    banner.removeEventListener('touchstart',unlock);
    banner.removeEventListener('pointerdown',unlock);
  }
  banner.addEventListener('touchstart',unlock,{passive:true});
  banner.addEventListener('pointerdown',unlock);
})();

// ── Spawn apples ──
spawnApple();
setInterval(spawnApple, 700+Math.random()*800);
