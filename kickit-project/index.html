<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FOR THE FAIREST GODDESS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a2e10;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;}

/* ══ CURSOR ══ */
#cursor{position:fixed;width:48px;height:48px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
@media(hover:none){#cursor{display:none!important;}}

/* ══ TRANSFORM SCREEN ══ */
#transform-screen{width:100%;max-width:700px;min-height:100vh;min-height:100dvh;background:#243820;position:relative;overflow:hidden;border-radius:0;cursor:none;}
@media(min-width:700px){#transform-screen{min-height:740px;border-radius:14px;}}
@media(hover:none){#transform-screen{cursor:auto;}}
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
#pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.header{position:relative;z-index:2;text-align:center;padding:24px 20px 4px;}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:0.5em;color:rgba(180,240,100,0.6);margin-bottom:4px;text-transform:uppercase;}
.header h1{font-family:'Cinzel',serif;font-size:20px;font-weight:600;letter-spacing:0.13em;color:#b4f040;line-height:1.35;}
.hdiv{display:flex;align-items:center;justify-content:center;gap:10px;margin:7px auto 0;width:240px;}
.hline{flex:1;height:0.5px;background:linear-gradient(90deg,transparent,rgba(180,240,100,0.5),transparent);}
.hgem{width:5px;height:5px;background:#b4f040;transform:rotate(45deg);}
.stage{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:10px 4px 0;min-height:400px;}
.char-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.char-label{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.22em;color:rgba(180,240,100,0.9);margin-top:3px;}
.char-frame{width:160px;height:340px;position:relative;}
@media(min-width:500px){.char-frame{width:190px;height:380px;}}
.char-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity 0.9s ease,filter 1.1s ease;}
.idol-img{opacity:0;}.idol-img.visible{opacity:1;}.char-img-before.hidden{opacity:0;}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-bottom:26px;}
.tbtn{width:56px;height:56px;border-radius:50%;background:rgba(180,240,100,0.08);border:1px solid rgba(180,240,100,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
@media(hover:hover){.tbtn{cursor:none;}}
.tbtn:hover{background:rgba(180,240,100,0.2);border-color:#b4f040;box-shadow:0 0 28px rgba(180,240,100,0.4);}
.tbtn.rev{background:rgba(180,240,100,0.12);border-color:rgba(180,240,100,0.7);}
.bring{position:absolute;inset:-7px;border-radius:50%;border:0.5px solid rgba(180,240,100,0.2);animation:spnr 8s linear infinite;}
.bring2{position:absolute;inset:-14px;border-radius:50%;border:0.5px dashed rgba(180,240,100,0.1);animation:spnr 14s linear infinite reverse;}
@keyframes spnr{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.bicon{font-family:'Cinzel',serif;font-size:18px;color:#d4af37;line-height:1;transition:all 0.4s;}
.bhint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(212,175,55,0.38);letter-spacing:0.2em;transition:all 0.4s;}
.prow{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 30px 0;}
.plabel{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:10px;color:rgba(212,175,55,0.33);letter-spacing:0.25em;transition:all 0.5s;}
.ptrack{width:230px;height:2px;background:rgba(212,175,55,0.1);border-radius:1px;overflow:hidden;}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#8B6914,#d4af37,#ffe57a);border-radius:1px;}
.btnrow{position:relative;z-index:3;display:flex;justify-content:center;gap:12px;padding:12px 20px 20px;min-height:52px;}
.go-btn{display:none;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.25em;color:#1a2e10;background:linear-gradient(135deg,#b4f040,#dcff90);border:none;border-radius:22px;padding:12px 28px;cursor:pointer;transition:all 0.3s;-webkit-tap-highlight-color:transparent;}
.go-btn:hover{box-shadow:0 0 28px rgba(180,240,100,0.7);transform:scale(1.05);}
.go-btn.show{display:inline-block;}
#fov{position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:14px;opacity:0;transition:opacity 0.5s;}

/* ══ ASMR SCREEN ══ */
#asmr-screen{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:100;}
.asmr-container{display:flex;width:100%;height:100%;flex-direction:column;}
@media(orientation:landscape){
  .asmr-container{flex-direction:row;}
  .asmr-zone{border-right:3px solid #1a1a1a;border-bottom:none!important;}
  .asmr-zone:last-child{border-right:none;}
}
.asmr-zone{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:3px solid #1a1a1a;}
.asmr-zone:last-child{border-bottom:none;}
#az1{background:#c8e6a0;cursor:pointer;}
#az2{background:#d4f0a0;}
#az3{background:#e8f5d0;}
.halftone-overlay{position:absolute;inset:0;pointer-events:none;opacity:0.15;}

/* falling apples */
.apple{position:absolute;cursor:pointer;pointer-events:auto;transform-origin:center top;animation:fall linear forwards;display:flex;align-items:center;justify-content:center;}
@keyframes fall{0%{top:-70px;opacity:1;}100%{top:110%;opacity:1;}}
.apple-svg{width:100%;height:100%;overflow:visible;}
.burst-piece{position:absolute;pointer-events:none;border-radius:50%;animation:burst-fly 0.5s ease-out forwards;}
@keyframes burst-fly{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(0.2);}}

/* squishy */
#sq{overflow:visible;cursor:grab;touch-action:none;}
#sq:active{cursor:grabbing;}

/* keycaps */
.kb-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.kb-base{background:linear-gradient(180deg,#d8d8d8 0%,#c8c8c8 100%);border-radius:16px;padding:14px 18px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;border:1px solid #b0b0b0;box-shadow:0 2px 8px rgba(0,0,0,0.18),0 1px 0 rgba(255,255,255,0.6) inset;}
.kb-row{display:flex;gap:10px;align-items:flex-end;}
.key-wrap{display:flex;flex-direction:column;align-items:center;}
.key-side{width:52px;height:3px;background:#a0a0a0;border-radius:0 0 4px 4px;transition:height 0.05s;}
.key{width:52px;height:48px;border-radius:8px;background:linear-gradient(180deg,#f5f5f5 0%,#e8e8e8 100%);cursor:pointer;position:relative;border:1px solid #b8b8b8;box-shadow:0 1px 0 rgba(255,255,255,0.9) inset,0 -1px 0 rgba(0,0,0,0.08) inset,0 2px 4px rgba(0,0,0,0.12);transition:transform 0.05s,box-shadow 0.05s;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:13px;font-weight:300;color:#333;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;}
.key::after{content:'';position:absolute;top:6px;left:7px;width:14px;height:7px;background:rgba(255,255,255,0.7);border-radius:50%;transform:rotate(-20deg);}
.key.down{transform:translateY(3px);box-shadow:0 0 0 rgba(255,255,255,0.9) inset,0 -1px 0 rgba(0,0,0,0.08) inset,0 0 2px rgba(0,0,0,0.1);}
.key.down+.key-side{height:1px;}
.key-space{width:170px!important;}.key-space-side{width:170px!important;}

/* back button */
#asmr-back{position:fixed;top:14px;left:14px;z-index:200;padding:10px 18px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.4);color:white;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.15em;cursor:pointer;border-radius:20px;transition:background 0.2s;-webkit-tap-highlight-color:transparent;}
#asmr-back:hover{background:rgba(0,0,0,0.55);}

/* particles */
.pp{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;border:1.5px solid #1a1a1a;animation:pa 0.55s ease-out forwards;}
@keyframes pa{0%{opacity:1;transform:translate(0,0) scale(1);}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}}

/* unlock banner */
#unlock-banner{position:fixed;top:-60px;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;background:#7dc940;padding:12px 20px;cursor:pointer;border-bottom:3px solid #1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.15);transition:top 0.35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursor">
<svg viewBox="0 0 16 16" width="48" height="48" image-rendering="pixelated" xmlns="http://www.w3.org/2000/svg">
  <!-- stem -->
  <rect x="7" y="0" width="2" height="2" fill="#3a6010"/>
  <rect x="8" y="1" width="3" height="1" fill="#2a4a08"/>
  <!-- leaf -->
  <rect x="9" y="1" width="2" height="1" fill="#5aaa20"/>
  <rect x="10" y="0" width="2" height="1" fill="#4a9010"/>
  <!-- apple body — green -->
  <rect x="3" y="2" width="10" height="1" fill="#6ab830"/>
  <rect x="2" y="3" width="12" height="1" fill="#7acc40"/>
  <rect x="1" y="4" width="14" height="1" fill="#88dd50"/>
  <rect x="1" y="5" width="14" height="1" fill="#96ee5a"/>
  <rect x="1" y="6" width="14" height="1" fill="#a0f060"/>
  <rect x="1" y="7" width="14" height="1" fill="#aaff66"/>
  <rect x="1" y="8" width="14" height="1" fill="#a0f060"/>
  <rect x="1" y="9" width="14" height="1" fill="#96ee5a"/>
  <rect x="1" y="10" width="14" height="1" fill="#88dd50"/>
  <rect x="2" y="11" width="12" height="1" fill="#7acc40"/>
  <rect x="3" y="12" width="10" height="1" fill="#6ab830"/>
  <rect x="4" y="13" width="8" height="1" fill="#5aaa28"/>
  <rect x="5" y="14" width="6" height="1" fill="#4a9020"/>
  <!-- shine -->
  <rect x="3" y="4" width="3" height="2" fill="#ccffaa" opacity="0.7"/>
  <rect x="4" y="6" width="1" height="1" fill="#ddffbb" opacity="0.5"/>
  <!-- indent top -->
  <rect x="7" y="2" width="2" height="1" fill="#5aaa20"/>
</svg>
</div>

<!-- TRANSFORM SCREEN -->
<div id="transform-screen">
<canvas id="bg-canvas"></canvas>
<canvas id="pc"></canvas>
<div class="header">
  <div class="header-sub">✦ idol transformation ✦</div>
  <h1>FOR THE FAIREST<br>GODDESS</h1>
  <div class="hdiv"><div class="hline"></div><div class="hgem"></div><div class="hline"></div></div>
</div>
<div class="stage">
  <div class="char-wrap">
    <div class="char-frame">
      <img class="char-img-before" id="bef-l" src="./images/be-hyun.png"/>
      <img class="idol-img" id="aft-l" src="./images/af-hyun.png"/>
    </div>
    <div class="char-label">HYUN</div>
  </div>
  <div class="center-col">
    <div class="bhint" id="bhint-top">아이돌 변신</div>
    <div class="tbtn" id="tbtn" onclick="handleBtn()">
      <div class="bring"></div><div class="bring2"></div>
      <span class="bicon" id="bicon">✦</span>
    </div>
    <div class="bhint" id="bhint">클릭</div>
  </div>
  <div class="char-wrap">
    <div class="char-frame">
      <img class="char-img-before" id="bef-r" src="./images/be-dain.png"/>
      <img class="idol-img" id="aft-r" src="./images/af-dain.png"/>
    </div>
    <div class="char-label">DA-IN</div>
  </div>
</div>
<div class="prow">
  <div class="plabel" id="plbl">star power</div>
  <div class="ptrack"><div class="pfill" id="pfill"></div></div>
</div>
<div class="btnrow">
  <button id="go-btn" class="go-btn" onclick="kickIt()">KICK IT! ✦</button>
</div>
<div id="fov"></div>
</div>

<!-- ASMR SCREEN -->
<div id="asmr-screen">
  <button id="asmr-back" onclick="exitAsmr()">← Back</button>
  <div class="asmr-container">
    <div class="asmr-zone" id="az1">
      <svg class="halftone-overlay" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="ht1" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="#2a6800"/></pattern></defs><rect width="100%" height="100%" fill="url(#ht1)"/></svg>
    </div>
    <div class="asmr-zone" id="az2">
      <svg class="halftone-overlay" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="ht2" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="#3a8000"/></pattern></defs><rect width="100%" height="100%" fill="url(#ht2)"/></svg>
      <svg id="sq" viewBox="0 0 220 230" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="htBody" x="0" y="0" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#3a8000"/></pattern></defs>
        <ellipse id="shad" cx="110" cy="212" rx="52" ry="9" fill="rgba(0,0,0,0.18)"/>
        <path id="body" fill="#7dc940" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
        <path id="bodyHT" fill="url(#htBody)" opacity="0.45"/>
        <path id="inner" fill="#a0e060" opacity="0.45"/>
        <ellipse id="spec" cx="88" cy="80" rx="14" ry="9" fill="rgba(255,255,255,0.55)" transform="rotate(-25,88,80)"/>
        <path id="leafPath" d="M110,52 C100,30 70,18 65,28 C60,38 88,46 110,52 Z" fill="#2e7d1a" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
        <path id="leafVein" d="M110,52 C92,42 74,28 65,28" stroke="#1a5010" stroke-width="1.5" fill="none"/>
        <path id="stemP" d="M110,52 Q112,38 110,28" stroke="#3d6e18" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="asmr-zone" id="az3">
      <svg class="halftone-overlay" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="ht3" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="#aaaaaa"/></pattern></defs><rect width="100%" height="100%" fill="url(#ht3)"/></svg>
      <div class="kb-wrap"><div class="kb-base" id="kbBase"></div></div>
    </div>
  </div>
</div>

<!-- UNLOCK BANNER -->
<div id="unlock-banner">
  <span style="font-size:14px;animation:pulse 1.2s ease-in-out infinite;display:inline-block;">🍏</span>
  <span style="font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.2em;color:#1a1a1a;">TAP HERE TO START</span>
  <span style="font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:10px;color:#1a1a1a;opacity:0.6;margin-left:4px;">기기 무음모드를 해제해주세요!</span>
</div>

<script>
/* ════════════ TRANSFORM ════════════ */
const app=document.getElementById('transform-screen');
const bgC=document.getElementById('bg-canvas'),pC=document.getElementById('pc');
const bgX=bgC.getContext('2d'),pX=pC.getContext('2d');
const befL=document.getElementById('bef-l'),befR=document.getElementById('bef-r');
const aftL=document.getElementById('aft-l'),aftR=document.getElementById('aft-r');
const pfill=document.getElementById('pfill'),plbl=document.getElementById('plbl');
const fov=document.getElementById('fov');
const bicon=document.getElementById('bicon'),bhint=document.getElementById('bhint');
const bhintTop=document.getElementById('bhint-top');
const goBtn=document.getElementById('go-btn'),tbtn=document.getElementById('tbtn');
let transformed=false,busy=false,stars=[],tParts=[],blockP=false,bgRaf=null;

document.addEventListener('mousemove',e=>{
  document.getElementById('cursor').style.left=e.clientX+'px';
  document.getElementById('cursor').style.top=e.clientY+'px';
});

function resize(){bgC.width=pC.width=app.offsetWidth;bgC.height=pC.height=app.offsetHeight;}
function initStars(){stars=[];for(let i=0;i<130;i++)stars.push({x:Math.random()*bgC.width,y:Math.random()*bgC.height,r:Math.random()*1.5+0.2,a:Math.random(),spd:Math.random()*0.007+0.002,gold:Math.random()<0.3});}

class Pt{
  constructor(x,y,type){
    this.x=x;this.y=y;const a=Math.random()*Math.PI*2,s=Math.random()*7+1;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s-3.5;
    this.life=1;this.decay=Math.random()*0.013+0.008;this.sz=Math.random()*9+2;
    const P={
      gold:['#b4f040','#dcff90','#ccff66','#aaff44'],
      pink:['#88ffaa','#aaffcc','#66ffbb','#ddffee'],
      rainbow:['#44ff66','#88ff44','#ccff44','#44ccff','#44ffaa','#aaff44'],
      sparkle:['#ffffff','#ccffaa','#b4f040','#aaffcc'],
      star:['#b4f040','#dcff90','#ffffff']
    };
    const pal=P[type]||P.gold;this.col=pal[Math.floor(Math.random()*pal.length)];
    this.shape=Math.random()<0.3?'star':Math.random()<0.4?'heart':'circle';
    this.rot=Math.random()*Math.PI*2;this.rotS=(Math.random()-.5)*0.22;this.g=0.09;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=0.98;this.life-=this.decay;this.rot+=this.rotS;}
  draw(ctx){
    if(this.life<=0)return;ctx.save();ctx.globalAlpha=Math.max(0,this.life);ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.col;
    if(this.shape==='star')dStar(ctx,0,0,this.sz*0.4,this.sz,5);
    else if(this.shape==='heart')dHeart(ctx,0,0,this.sz*0.7);
    else{ctx.beginPath();ctx.arc(0,0,this.sz*0.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
}
function dStar(ctx,cx,cy,ir,or,pts){ctx.beginPath();for(let i=0;i<pts*2;i++){const a=(i*Math.PI)/pts-Math.PI/2,r=i%2===0?or:ir;i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.fill();}
function dHeart(ctx,cx,cy,s){ctx.beginPath();ctx.moveTo(cx,cy+s*.3);ctx.bezierCurveTo(cx,cy-s*.3,cx-s,cy-s*.3,cx-s,cy);ctx.bezierCurveTo(cx-s,cy+s*.5,cx,cy+s*.8,cx,cy+s*.8);ctx.bezierCurveTo(cx,cy+s*.8,cx+s,cy+s*.5,cx+s,cy);ctx.bezierCurveTo(cx+s,cy-s*.3,cx,cy-s*.3,cx,cy+s*.3);ctx.fill();}
function burst(cx,cy,types,n){if(blockP)return;for(let i=0;i<n;i++){const t=types[Math.floor(Math.random()*types.length)];tParts.push(new Pt(cx,cy,t));}}
function bigBurst(cx,cy){
  [{t:['gold','sparkle'],n:70},{t:['pink','rainbow'],n:60},{t:['star','sparkle'],n:50}].forEach((w,i)=>setTimeout(()=>burst(cx,cy,w.t,w.n),i*130));
  setTimeout(()=>{burst(cx-110,cy-50,['rainbow','sparkle'],35);burst(cx+110,cy-50,['rainbow','sparkle'],35);},320);
  setTimeout(()=>{burst(cx,cy-90,['gold','star'],45);burst(cx-130,cy,['pink'],28);burst(cx+130,cy,['pink'],28);},540);
  setTimeout(()=>burst(cx,cy,['sparkle','star','gold'],60),860);
}
function bgLoop(){
  bgX.clearRect(0,0,bgC.width,bgC.height);
  stars.forEach(s=>{s.a+=s.spd;if(s.a>1||s.a<0)s.spd*=-1;bgX.beginPath();bgX.arc(s.x,s.y,s.r,0,Math.PI*2);bgX.fillStyle=s.gold?`rgba(180,240,100,${s.a*0.7})`:`rgba(200,255,140,${s.a*0.35})`;bgX.fill();});
  pX.clearRect(0,0,pC.width,pC.height);
  tParts=tParts.filter(p=>p.life>0);tParts.forEach(p=>{p.update();p.draw(pX);});
  bgRaf=requestAnimationFrame(bgLoop);
}

function kickIt(){
  goBtn.style.transform='scale(0.93)';setTimeout(()=>goBtn.style.transform='',200);
  setTimeout(()=>{
    document.getElementById('cursor').style.display='none';
    document.body.style.cursor='default';
    document.getElementById('transform-screen').style.display='none';
    document.getElementById('asmr-screen').style.display='block';
    if(bgRaf){cancelAnimationFrame(bgRaf);bgRaf=null;}
    startAsmr();
  },220);
}
function exitAsmr(){
  stopAsmr();
  document.getElementById('asmr-screen').style.display='none';

const CX=110,CY=115,R=68;
let drag=null,sX=0,sY=0,vX=0,vY=0,raf2,lastSnd=0;
function setSqSize(){
  const az2=document.getElementById('az2');if(!az2)return;
  const s=Math.min(az2.clientWidth,az2.clientHeight)*0.82;
  document.getElementById('sq').setAttribute('width',s);document.getElementById('sq').setAttribute('height',s);
}
function blobPath(dx,dy,cx,cy,r){
  const mag=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx),pull=Math.min(mag,80);
  const stretch=1+pull/85,squeeze=1/Math.sqrt(stretch),N=32,pts=[];
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2,ux=Math.cos(a),uy=Math.sin(a);
    const along=ux*Math.cos(ang)+uy*Math.sin(ang),perp=-ux*Math.sin(ang)+uy*Math.cos(ang);
    const ef=along>0?stretch:(1+(stretch-1)*0.08);
    pts.push({x:cx+(along*ef*Math.cos(ang)-perp*squeeze*Math.sin(ang))*r,y:cy+(along*ef*Math.sin(ang)+perp*squeeze*Math.cos(ang))*r});
  }
  let d=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<N;i++){
    const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)} ${(p1.y+(p2.y-p0.y)/6).toFixed(1)},${(p2.x-(p3.x-p1.x)/6).toFixed(1)} ${(p2.y-(p3.y-p1.y)/6).toFixed(1)},${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d+'Z';
}
function drawBlob(dx,dy){
  const bp=blobPath(dx,dy,CX,CY,R);
  document.getElementById('body').setAttribute('d',bp);
  document.getElementById('bodyHT').setAttribute('d',bp);
  document.getElementById('inner').setAttribute('d',blobPath(dx,dy,CX,CY,R*0.52));
  const mag=Math.min(Math.sqrt(dx*dx+dy*dy),80);
  document.getElementById('shad').setAttribute('rx',(50+mag*0.1).toFixed(1));
  document.getElementById('shad').setAttribute('ry',Math.max(2,9-mag*0.07).toFixed(1));
  document.getElementById('spec').setAttribute('cx',(88-dx*0.06).toFixed(1));
  document.getElementById('spec').setAttribute('cy',(80-dy*0.06).toFixed(1));
  const tx=(CX+dx*0.03).toFixed(1),ty=(CY-R+dy*0.03-2).toFixed(1);
  document.getElementById('stemP').setAttribute('d',`M${tx},${ty} Q${(+tx+2)},${(+ty-14)} ${tx},${(+ty-22)}`);
  const lrot=(Math.atan2(dy,dx)*(180/Math.PI)*0.15).toFixed(1);
  document.getElementById('leafPath').setAttribute('transform',`translate(${(+tx-110).toFixed(1)},${(+ty-52).toFixed(1)}) rotate(${lrot},110,52)`);
  document.getElementById('leafVein').setAttribute('transform',`translate(${(+tx-110).toFixed(1)},${(+ty-52).toFixed(1)}) rotate(${lrot},110,52)`);
}
function sqDown(e){e.preventDefault();document.getElementById('sq').setPointerCapture(e.pointerId);drag={x0:e.clientX,y0:e.clientY};cancelAnimationFrame(raf2);}
function sqMove(e){
  if(!drag)return;sX=(e.clientX-drag.x0)*1.3;sY=(e.clientY-drag.y0)*1.3;drawBlob(sX,sY);
  const now=Date.now(),mag=Math.sqrt(sX*sX+sY*sY);
  if(mag>10&&now-lastSnd>90){playStretch(mag);lastSnd=now;}
}
function sqUp(e){
  if(!drag)return;drag=null;
  if(Math.sqrt(sX*sX+sY*sY)>8)playSnap();
  vX=-sX*0.3;vY=-sY*0.3;springLoop();
}
function springLoop(){
  vX+=-0.15*sX;vY+=-0.15*sY;vX*=0.70;vY*=0.70;sX+=vX;sY+=vY;drawBlob(sX,sY);
  if(Math.sqrt(sX*sX+sY*sY)>0.25||Math.sqrt(vX*vX+vY*vY)>0.08)raf2=requestAnimationFrame(springLoop);
  else{sX=0;sY=0;drawBlob(0,0);}
}

  sq.addEventListener('pointerup',sqUp);
  spawnApple();
  clearInterval(appleTimer);
  appleTimer=setInterval(spawnApple,700+Math.random()*800);
}
function stopAsmr(){
  clearInterval(appleTimer);appleTimer=null;
  document.querySelectorAll('.apple').forEach(a=>a.remove());
  const sq=document.getElementById('sq');
  sq.removeEventListener('pointerdown',sqDown);
  sq.removeEventListener('pointermove',sqMove);
  sq.removeEventListener('pointerup',sqUp);
  cancelAnimationFrame(raf2);
  // 배너 숨김
  const banner=document.getElementById('unlock-banner');
  banner.style.top='-60px';setTimeout(()=>banner.style.display='none',380);
}
window.addEventListener('resize',setSqSize);
</script>
